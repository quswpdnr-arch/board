.hmeta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:700}
.sec{display:grid;gap:12px;margin-bottom:28px;align-content:start}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead .sub{color:var(--muted);font-size:12.5px}
.sechead .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:grid;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)} .kpi.soon .val{color:var(--soon)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.7}
.st-late{background:var(--bad-soft);color:var(--bad)} .st-over{background:var(--warn-soft);color:var(--warn)}
.st-soon{background:var(--soon-soft);color:var(--soon)} .st-open{background:var(--info-soft);color:var(--info)}
.st-none{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-done{background:var(--ok-soft);color:var(--ok)} .st-closed{background:var(--sunk);color:var(--muted)}
.kind{font-size:11px;color:var(--muted)} .kind.fixed{color:var(--fg);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.pname{font-weight:600} .pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{font-size:12px;padding:3px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12.5px}
input[type=search]{min-width:220px;flex:1 1 220px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{color:var(--fg)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dlist{display:grid}

{ const d = new Date(); S.cal = {y:d.getFullYear(), m:d.getMonth()}; }

    active: d.active!=null ? !!d.active : !m.inactive, staff:[...new Set((m.contacts||[]).map(x=>personName(x,f)).filter(Boolean))].slice(0,3), isNew:!FMETA[f], doc:!!facDocs[f]};

// 리드타임 = 오더일 → 첫 입고일까지 걸린 날짜의 평균 (상품 → 공장 → 전체 순)
let LT = {s:new Map(), f:new Map(), all:LEAD._all};
const ltKey = p => normK(p.n||p.en||p.b);
function buildLead(){
  const S1 = new Map(), F1 = new Map(), A = [];
  const push = (m,k,v) => { if(!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for(const o of ORDERS){
    if(!o.od) continue;
    const ds = o.rc.map(r=>r.d).concat(o.rcAdd.map(r=>r.d)).filter(Boolean).sort();

  LT = {s:new Map([...S1].map(([k,a])=>[k,avg(a)])), f:new Map([...F1].map(([k,a])=>[k,avg(a)])), all: A.length ? avg(A) : LEAD._all};

      recv0:0, rem0:Number(no.qty)||0, rc:[], memo:no.memo||'', src:'db', at:no.at, by:no.by});
  }
  for(const n of Object.keys(facDocs)) facs.add(n);
  for(const c of fchgs) if(c.to) facs.add(c.to);
  const SI = stockLive() ? stockDoc.items : null;
  for(const p of PRODS.values()){
    for(const ob of p.origBs){ const d = pfixDocs[ob]; if(!d) continue; for(const k of ['n','en','opt','cat','country']) if(d[k]) p[k] = d[k]; }
    if(SI){ const it = SI[p.b] || [...p.origBs].map(b=>SI[b]).find(Boolean); if(it){ p.stock = it[0]; p.avail = it[1]; } }
  }
  buildLead();
  for(const o of ORDERS) if(o.etaKind==='est'){ const li = leadInfo(o.p, o.f); o.eta = addDays(o.od, li.d); o.leadSrc = li.src; o.status = statusOf(o); }
  const rnum = r => { const m = /(\d+)/.exec(r||''); return m ? +m[1] : 0; };
  for(const p of PRODS.values()){
    p.orders.forEach((o,i)=>o._i=i);
    p.orders.sort((a,b)=> rnum(a.round)-rnum(b.round) || (a.od||'').localeCompare(b.od||'') || a._i-b._i);
    // 시트가 공장별로 나뉘어 있던 이관 이력 (같은 바코드가 두 공장 시트에 있음)
    p.autoMoves = [];
    let prev = null;
    for(const o of p.orders){ if(prev && o.f0!==prev.f0) p.autoMoves.push({from:prev.f0, to:o.f0, date:o.od||'', auto:true}); prev = o; }
    if(p.orders.length) p.curFac = p.orders[p.orders.length-1].f;
    const cs = CHG.get(p.b) || [];
    if(cs.length){ p.moves = cs; p.curFac = cs[cs.length-1].to; p.facs.add(p.curFac); }
  }
  unifyFactories();
  FACTORIES = [...facs].filter(Boolean);
}
function facForOrder(o, open){
  let f = o.f;
  for(const c of (CHG.get(o.p.b)||[])){
    if(o.src==='db' && o.f===c.to) continue;
    if((o.od && c.date && o.od >= c.date) || (c.open && open)) f = c.to;
  }
  return f;
}
function addOrder(o){
  const v = ovr[o.id] || {};
  const add = Array.isArray(v.recv) ? v.recv : [];
  o.rcAdd = add.map(x => ({q:Number(x.q)||0, d:x.d||'', by:x.by, add:true}));
  const addQ = o.rcAdd.reduce((s,x)=>s+x.q,0);
  o.recv = o.recv0 + addQ;
  if(v.qty!=null && v.qty!==''){ o.qty = Number(v.qty); o.rem0 = Math.max(0, o.qty - o.recv0); }
  const inactive = INACTIVE.has(o.f) && !v.closed && o.src==='snap';
  const zero = !v.closed && o.qty===0 && o.recv===0;
  o.closed = !!v.closed || inactive || zero; o.closeReason = v.closeReason || (inactive ? '진행안함 시트' : (zero ? '수량 0' : ''));
  o.cancels = (Array.isArray(v.cancel) ? v.cancel : []).map(x=>({q:Number(x.q)||0, r:x.r||'', d:x.d||'', by:x.by}));
  const cq = o.cancels.reduce((s,x)=>s+x.q,0); o.cancelQ = cq;
  o.remain = o.closed ? 0 : Math.max(0, o.rem0 - addQ - cq);
  if(!o.closed && cq>0 && o.remain===0 && o.recv===0){ o.closed = true; o.closeReason = '전량 취소 · '+(o.cancels[o.cancels.length-1].r||''); }
  o.f0 = o.f; o.f = facForOrder(o, o.remain>0);
  o.changes = Array.isArray(v.log) ? v.log : [];
  o.etaReason = v.reason || '';
  if(v.eta){ o.eta = v.eta; o.etaKind = 'fixed'; }
  else if(o.eta0){ o.eta = o.eta0; o.etaKind = 'fixed'; }
  else if(o.od && o.remain>0){ o.eta = addDays(o.od, leadFor(o.f)); o.etaKind = 'est'; }
  else { o.eta = ''; o.etaKind = ''; }
  o.firstEta = (o.changes.find(c=>c.type==='eta')||{}).from || '';
  o.status = statusOf(o);
  o.p.orders.push(o); ORDERS.push(o); BYID.set(o.id, o);
}
function statusOf(o){
  if(o.closed) return 'closed';
  if(o.remain<=0) return 'done';
  if(!o.eta) return 'none';
  if(o.eta < TODAY) return o.etaKind==='fixed' ? 'late' : 'over';
  if(o.eta <= addDays(TODAY,7)) return 'soon';
  return 'open';
}
const isOpen = o => o.remain>0 && !o.closed;
function nextRound(p){
  let mx = 0; for(const o of p.orders){ const m = /^(\d+)\s*차/.exec(o.round); if(m) mx = Math.max(mx, +m[1]); }
  return (mx+1)+'차';
}

  }catch(e){ DB = null; }

  DB.collection('ord').onSnapshot(s => { newOrds={}; s.docs.forEach(d=>newOrds[d.id]=d.data()); if(first.o){first.o=false;ready();} else refresh(); }, fail);
  DB.collection('ovr').onSnapshot(s => { ovr={}; s.docs.forEach(d=>ovr[d.id]=d.data()); if(first.v){first.v=false;ready();} else refresh(); }, fail);
  DB.collection('fac').onSnapshot(s => { facDocs={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.name) facDocs[x.name]=x; }); if(first.f){first.f=false;ready();} else refresh(); }, fail);
  DB.doc('stock/current').onSnapshot(d => { stockDoc = d.exists ? d.data() : null; if(first.s){first.s=false;ready();} else refresh(); }, fail);

  DB.collection('fchg').onSnapshot(s => { fchgs = s.docs.map(d=>Object.assign({id:d.id}, d.data())); if(first.c){first.c=false;ready();} else refresh(); }, fail);

}

function barcodeRows(){
  const m = new Map();
  for(const o of filteredDue().filter(isOpen)){
    const k = o.p.b || o.p.key;
    const r = m.get(k) || {b:o.p.b, n:o.p.n, en:o.p.en, opt:o.p.opt, f:new Set(), q:0, eta:'', rounds:[], stock:hasStock(o.p)?o.p.stock:'', avail:hasStock(o.p)?availIn(o.p):''};
    r.f.add(o.f); r.q += o.remain; if(o.eta && (!r.eta || o.eta<r.eta)) r.eta=o.eta; r.rounds.push(o.round);
    m.set(k,r);
  }
  return [...m.values()].sort((a,b)=>(a.eta||'9').localeCompare(b.eta||'9'));
}
function toTable(rows, sep){
  const q = v => { v = String(v==null?'':v); return sep===',' && /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v.replace(/[\t\n]/g,' '); };
  return rows.map(r=>r.map(q).join(sep)).join('\r\n');
}

function dueCards(a){
  // 컬러(바코드)마다 한 장씩

function parseBulk(t){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b && !byB.has(p.b)) byB.set(p.b,p);
  return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const c = l.split(/\t|,(?=\s*\d)|\s{2,}/).map(x=>x.trim());
    const b = c[0].replace(/^잔여량-/,''); const qty = parseInt(String(c[1]||'').replace(/[^\d]/g,''),10)||0;
    let eta = (c[2]||'').replace(/[./]/g,'-'); if(!/^\d{4}-\d{2}-\d{2}$/.test(eta)) eta='';
    return {b, qty, eta, p:byB.get(b)};
  });
}

function facRows(){

  for(const o of ORDERS){ const x = fs[o.f]; if(!x) continue; if(o.od && o.od>x.last) x.last=o.od; if(isOpen(o)){ x.open++; x.rem+=o.remain; if(o.status==='late'||o.status==='over') x.late++; } }
  for(const st of STYLES.values()){ const x = fs[st.f]; if(x) x.styles.add(st.key); }

}

const normK = x => String(x||'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'');
function issuesOf(p){
  const out = [];
  if(isNoB(p.b)) out.push('nob');
  if(!p.n) out.push('non');
  if(!p.en) out.push('noen');
  if(!/,/.test(p.opt||'')) out.push('opt');
  if(!p.cat) out.push('nocat');
  if(p.curFac && !countryP(p)) out.push('country');
  return out;
}
const ISS = {nob:['바코드 없음','st-late'], non:['제작품명 없음','st-late'], noen:['상품명(영문) 없음','st-over'], opt:['컬러,사이즈 형식 확인','st-soon'], nocat:['분류 없음','st-none'], fac:['셀메이트 공급처 다름','st-open'], mix:['같은 제작품명 다른 공장','st-soon'], country:['국가 확인','st-over']};
function suggestFor(p){
  if(!isNoB(p.b)) return null;
  const o = normK(p.opt), n = normK(p.n), e = normK(p.en);
  for(const q of PRODS.values()){
    if(q===p || isNoB(q.b) || normK(q.opt)!==o) continue;
    if((n && normK(q.n)===n) || (e && normK(q.en)===e)) return q;
  }
  return null;
}

function parsePasteSimple(t){
  const lines = t.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {err:'머리글 줄과 상품 줄을 함께 붙여넣으세요.'};
  const head = lines[0].split('\t').map(x=>x.trim());
  const find = (...names) => head.findIndex(h=>names.some(n=>h.replace(/\s/g,'').includes(n)));
  const ib = find('바코드'), io = find('옵션'), im = find('사입상품명','제작품명','작지명'), ic = find('분류');
  let ie = head.findIndex((h,i)=>/상품명/.test(h) && i!==im);
  if(ib<0 && im<0) return {err:'머리글에서 "바코드" 또는 "제작품명" 열을 찾지 못했습니다.'};
  const rows = lines.slice(1).map(l=>{ const c = l.split('\t'); const g = i => i>=0 ? String(c[i]||'').trim() : '';
    return {b:g(ib).replace(/^잔여량-/,''), en:g(ie), opt:g(io), n:g(im), cat:g(ic)}; });
  return {rows};
}
function matchPaste(rows){
  const byB = new Map(), byNO = new Map();
  for(const r of rows){ if(r.b) byB.set(r.b, r); if(r.n && r.opt) byNO.set(normK(r.n)+'|'+normK(r.opt), r); }
  const out = [];
  for(const p of PRODS.values()){
    const iss = issuesOf(p); if(!iss.length) continue;
    const r = (!isNoB(p.b) && byB.get(p.b)) || byNO.get(normK(p.n)+'|'+normK(p.opt));
    if(!r) continue;
    const patch = {};
    if(isNoB(p.b) && r.b && !PRODS.has(r.b)) patch.b = r.b;
    if(isNoB(p.b) && r.b && PRODS.has(r.b)) patch.b = r.b;
    if(!p.n && r.n) patch.n = r.n;
    if(!p.en && r.en) patch.en = r.en;
    if(!p.cat && r.cat) patch.cat = r.cat;
    if(!/,/.test(p.opt||'') && r.opt && /,/.test(r.opt)) patch.opt = r.opt;
    if(Object.keys(patch).length) out.push({p, patch});
  }
  return out;
}

function parseTSV(t){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
    } else if(c==='"' && cell===''){ q = true; }
    else if(c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
// 양식 기본 열 순서 (머리글 없이 값만 붙여넣을 때)
const RO_DEFAULT = {od:0, b:1, staff:2, f:3, caution:4, en:5, opt:6, n:7, on:8, off:9, sum:10, eta:11, reason:12, resv:13, memo:14};
function roCols(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r = rows[i].map(x=>String(x||'').replace(/\s/g,''));
    const ib = r.findIndex(x=>x==='바코드'), io = r.findIndex(x=>x.startsWith('리오더날짜'));
    if(ib>=0 && io>=0){
      const f = (...ks) => r.findIndex(x=>ks.some(k=>x.startsWith(k)));
      return {start:i+1, cols:{od:io, b:ib, staff:f('담당'), f:f('공장'), caution:f('주의'), en:f('상품명'), opt:f('옵션'), n:f('사입상품명','제작품명'), on:f('온라인'), off:f('오프라인'), sum:f('합계'), eta:f('입고일정'), reason:f('일정변경'), resv:f('예약배송'), memo:f('비고')}, header:true};

function excelSerial(n){ const d = new Date(Date.UTC(1899,11,30)); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function parseDay(s, ref){
  s = String(s||'').trim(); if(!s) return '';
  let m;
  if(/^\d{5}(\.\d+)?$/.test(s)) return excelSerial(Math.floor(+s));
  if((m = /(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/.exec(s))) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m = /^(\d{2})(\d{2})(\d{2})$/.exec(s))) return '20'+m[1]+'-'+m[2]+'-'+m[3];
  if((m = /(\d{1,2})\s*[/.월]\s*(\d{1,2})/.exec(s))){
    const r = ref ? new Date(ref+'T00:00:00') : new Date(); let y = r.getFullYear(); const mo = +m[1];
    if(mo < r.getMonth()+1-2) y++;
    if(mo>12 || +m[2]>31) return '';
    return y+'-'+pad(mo)+'-'+pad(+m[2]);
  }
  return '';
}
// 입고일정 칸 → 날짜 하나 + 메모 ('11/11 -> 11/9' 는 마지막, '1차 94장 11/13 2차 56장 11/19' 는 첫 날짜)
function parseEta(s, od){
  s = String(s||'').trim(); if(!s) return {eta:'', note:''};
  if(/^\d{5}(\.\d+)?$/.test(s)) return {eta:excelSerial(Math.floor(+s)), note:''};
  const full = /(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})/g; let all = [], m;
  while((m = full.exec(s))) all.push(m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]));
  if(!all.length){ const md = /(\d{1,2})\s*\/\s*(\d{1,2})/g; while((m = md.exec(s))) all.push(parseDay(m[0], od)); all = all.filter(Boolean); }
  if(!all.length) return {eta:'', note:s.replace(/\s+/g,' ')};
  const changed = /->|→|>/.test(s);
  const eta = changed ? all[all.length-1] : all[0];
  const note = (all.length>1 || /[가-힣]/.test(s)) ? s.replace(/\s+/g,' ') : '';
  return {eta, note};
}
function roPlan(text){
  const rows = parseTSV(text); const {start, cols, header} = roCols(rows);
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const g = (r,k) => cols[k]>=0 && cols[k]!=null ? String(r[cols[k]]||'').trim() : '';
  const plan = [], miss = [], seen = new Set(); let same = 0, skipped = 0, dup = 0;
  for(const r of rows.slice(start)){
    const b = g(r,'b').replace(/^잔여량-/,''); const od = parseDay(g(r,'od'));
    const sum = parseInt(g(r,'sum').replace(/[^\d]/g,''),10);
    const qty = sum>0 ? sum : ((parseInt(g(r,'on').replace(/[^\d]/g,''),10)||0) + (parseInt(g(r,'off').replace(/[^\d]/g,''),10)||0));
    if(!b || !od || !(qty>0)){ if(b||od) skipped++; continue; }
    const key = b+'|'+od+'|'+qty; if(seen.has(key)){ dup++; continue; } seen.add(key);
    const {eta, note} = parseEta(g(r,'eta'), od);
    const reason = [note, g(r,'reason'), g(r,'caution')].filter(Boolean).join(' / ');

    const cands = p.orders.filter(o=>o.od===od);
    const o = cands.find(x=>x.qty===qty) || cands[0];
    if(!o){
      plan.push({type:'new', p, od, qty, eta, reason, done, part, label:'신규 리오더', text:nf(qty)+'장 · '+nextRound(p)+(eta?' · 예정 '+fmtDY(eta):'')+(done?' · 입고완료':'')+(reason?' · '+reason:'')});
      continue;
    }
    const ch = []; const patch = {}; const logs = [];
    if(qty!==o.qty){ patch.qty = qty; ch.push('수량 '+nf(o.qty)+' → '+nf(qty)); logs.push({type:'qty', msg:'수량 '+o.qty+' → '+qty+' (리오더 시트)'}); }
    const curFixed = o.etaKind==='fixed' ? o.eta : '';
    let shift = '';
    if(eta && eta!==curFixed && isOpen(o)){
      const dd = curFixed ? diffDays(eta, curFixed) : 0;

}

async function syncApply(){ if(!need('reorder')) return;
  const R = S.sync.res; if(!R) return;
  const picks = R.plan.filter((x,i)=>!S.sync.off[i]);
  if(!picks.length){ toast('반영할 줄을 고르세요'); return; }
  const at = new Date().toISOString(); const c = {new:0, eta:0, recv:0, qty:0};
  const n = await guardN(async()=>{
    for(const x of picks){
      if(x.type==='new'){
        const ref = await DB.collection('ord').add({b:x.p.b, f:x.p.curFac, round:nextRound(x.p), od:x.od, qty:x.qty, eta:x.eta||'', memo:(x.reason||''), src:'리오더 시트', at, by:MYID||''});
        if((x.done || x.part) && ref && ref.id){ const q = x.done ? x.qty : Math.min(x.part, x.qty); await DB.doc('ovr/n_'+ref.id).set({recv:[{q, d:(x.eta && x.eta<=TODAY ? x.eta : TODAY), by:MYID||''}], log:[{at, by:MYID||'', type:'recv', msg:'입고 '+q+'장 (리오더 시트)'}]}); }
        c.new++; continue;
      }
      const o = x.o; const cur = Object.assign({}, ovr[o.id]||{}); const patch = Object.assign({}, x.patch); const logs = (x.logs||[]).slice();
      if(x.recvQ>0){ patch.recv = (Array.isArray(cur.recv)?cur.recv:[]).concat([{q:x.recvQ, d:x.recvD, by:MYID||''}]); logs.push({type:'recv', msg:'입고 '+x.recvQ+'장 (리오더 시트)'}); }
      const next = Object.assign(cur, patch);
      next.log = (Array.isArray(next.log)?next.log:[]).concat(logs.map(l=>Object.assign({at, by:MYID||''}, l))).slice(-40);
      await DB.doc('ovr/'+o.id).set(next);
      c[x.type]++;
    }
    await writeLog('리오더 시트 반영: 신규 '+c.new+' · 일정 '+c.eta+' · 입고 '+c.recv+' · 수량 '+c.qty+'건');
    return picks.length;
  });
  if(n){ toast(n+'건 반영했습니다'); S.sync.res = null; S.sync.off = {}; render(); }
}

// ---------- 상품 목록(셀메이트 양식) 붙여넣기로 신규 등록 ----------
function parseDelim(t, d){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"' && cell===''){ q = true; }
    else if(c===d){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const unwrapX = v => String(v==null?'':v).replace(/^="(.*)"$/,'$1').trim();
function facFromSupplier(s){
  let x = unwrapX(s).replace(/\(.*?\)/g,'').split('-')[0].trim();
  x = x.replace(TITLE_RE,'').replace(/님$/,'').trim();
  if(!x) return '';
  const hit = FACTORIES.find(f=>normK(f)===normK(x));
  return hit || x;
}
function plParse(text){
  const d = (text.split('\n')[0].match(/\t/g)||[]).length >= (text.split('\n')[0].match(/,/g)||[]).length ? '\t' : ',';
  const rows = parseDelim(text, d).filter(r=>r.some(c=>String(c).trim()));
  let hi = rows.findIndex(r=>r.some(c=>/바코드/.test(c)) && r.some(c=>/옵션/.test(c)));
  if(hi<0) return {err:'머리글 줄을 찾지 못했습니다. "바코드번호", "옵션명" 머리글이 포함되게 복사해 주세요.'};
  const H = rows[hi].map(x=>unwrapX(x).replace(/\s/g,''));
  const col = (...ks) => { for(const k of ks){ const i = H.findIndex(h=>h===k); if(i>=0) return i; } for(const k of ks){ const i = H.findIndex(h=>h.startsWith(k)); if(i>=0) return i; } return -1; };
  const C = {b:col('바코드번호','바코드'), en:col('상품명'), n:col('사입상품명','제작품명'), opt:col('옵션명','옵션'), cat:col('상품분류','분류'), sup:col('공급처'), reg:col('상품등록일자','등록일'), stock:col('현재재고'), avail:col('가용재고'), sold:col('품절여부'), img:col('대표이미지주소','이미지주소')};
  const g = (r,k) => C[k]>=0 ? unwrapX(r[C[k]]) : '';
  const out = []; const seen = new Set(); let dupIn = 0;
  for(const r of rows.slice(hi+1)){
    const b = g(r,'b'); if(!b) continue;
    if(seen.has(b)){ dupIn++; continue; } seen.add(b);
    out.push({b, en:g(r,'en'), n:g(r,'n'), opt:g(r,'opt').replace(/\s*,\s*/g,','), cat:g(r,'cat'), sup:g(r,'sup'), f:facFromSupplier(g(r,'sup')), reg:(g(r,'reg').match(/\d{4}-\d{2}-\d{2}/)||[''])[0], stock:g(r,'stock'), avail:g(r,'avail'), sold:g(r,'sold'), img:cleanUrl(g(r,'img'))});
  }
  return {rows:out, dupIn};
}
function plPlan(rows){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const fresh = [], diff = []; let same = 0;
  for(const r of rows){
    const p = byB.get(r.b);
    if(!p){
      const skip = !r.n || /^자사$/.test(unwrapX(r.sup)) || /사은품|럭키박스|단일상품/.test(r.n+r.opt);
      fresh.push(Object.assign(r, {on:!skip, why: skip ? (!r.n ? '제작품명 없음' : '자사 · 사은품') : '', newFac: r.f && !FACTORIES.includes(r.f)}));
      continue;
    }
    const ch = {};
    for(const k of ['n','en','opt','cat']) if(r[k] && r[k]!==p[k]) ch[k] = r[k];
    if(Object.keys(ch).length) diff.push({p, r, ch, on:false}); else same++;
  }
  fresh.sort((a,b)=>(b.on-a.on) || (b.reg||'').localeCompare(a.reg||'') || (a.n||'').localeCompare(b.n||'','ko'));
  return {fresh, diff, same};
}

}
function plRun(text, fileName){

function recvPlan(text){
  const rows = parseTSV(text).map(r=>r.map(x=>String(x||'').trim())).filter(r=>r.some(Boolean));
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const plan = [], miss = []; const used = {};
  for(const r of rows){
    const bi = r.findIndex(x=>/^1-\d{10}$/.test(x.replace(/^잔여량-/,''))); if(bi<0) continue;
    const b = r[bi].replace(/^잔여량-/,'');
    const rest = r.slice(bi+1);
    const qi = rest.findIndex(x=>/^\d+$/.test(x.replace(/,/g,''))); const qty = qi>=0 ? parseInt(rest[qi].replace(/,/g,''),10) : 0;
    const d = rest.map(x=>parseDay(x)).find(Boolean) || TODAY;
    const p = byB.get(b);
    if(!p || !(qty>0)){ miss.push({b, qty, why: !p ? '보드에 없는 바코드' : '수량 없음'}); continue; }
    // 먼저 오더한 차수부터 잔여를 채운다
    let left = qty;
    const opens = p.orders.filter(isOpen).sort((x,y)=>(x.od||'').localeCompare(y.od||''));
    for(const o of opens){ const can = o.remain - (used[o.id]||0); if(can<=0) continue; const q = Math.min(can, left); used[o.id] = (used[o.id]||0)+q; plan.push({o, q, d}); left -= q; if(!left) break; }
    if(left>0){
      const last = opens[opens.length-1] || p.orders[p.orders.length-1];
      if(last) plan.push({o:last, q:left, d, over:true}); else miss.push({b, qty:left, why:'입고 기다리는 오더 없음'});
    }
  }
  return {plan, miss};
}

function stockPlan(text){
  const r = plParse(text); if(r.err) return {err:r.err};
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const items = {}; let same = 0, changed = 0, notIn = 0; const diffs = [];
  for(const x of r.rows){
    const st = parseInt(String(x.stock).replace(/[^\d-]/g,''),10), av = parseInt(String(x.avail).replace(/[^\d-]/g,''),10);
    if(isNaN(st) && isNaN(av)) continue;
    items[x.b] = [isNaN(st)?0:st, isNaN(av)?(isNaN(st)?0:st):av];
    const p = byB.get(x.b);
    if(!p){ notIn++; continue; }
    if(String(p.stock)===String(items[x.b][0]) && String(p.avail)===String(items[x.b][1])) same++;
    else { changed++; if(diffs.length<300) diffs.push({p, from:[p.stock, p.avail], to:items[x.b]}); }
  }
  return {items, n:Object.keys(items).length, same, changed, notIn, diffs};
}

function buildMix(){
  MIX = new Map(); const g = new Map();
  for(const p of PRODS.values()){ const k = normK(p.n); if(!k) continue; if(!g.has(k)) g.set(k, []); g.get(k).push(p); }
  for(const ps of g.values()){
    const cnt = {}; for(const p of ps) cnt[p.curFac] = (cnt[p.curFac]||0)+1;
    const facs = Object.keys(cnt); if(facs.length<2) continue;
    const main = facs.sort((a,b)=>cnt[b]-cnt[a] || a.localeCompare(b,'ko'))[0];

// 분류 = 시즌(26 FW4) + 품목(재킷)
function catParts(){
  const se = new Set(), ty = new Map();
  for(const p of PRODS.values()){ const m = /^(\d{2}\s*[A-Za-z]+\d*)\s+(.+)$/.exec(String(p.cat||'').trim()); if(!m) continue; se.add(m[1].toUpperCase()); ty.set(m[2], (ty.get(m[2])||0)+1); }
  const sk = x => { const m = /^(\d{2})\s*([A-Z]+)(\d*)/.exec(x)||[]; return [+(m[1]||0), m[2]==='FW'?2:m[2]==='SS'?1:0, +(m[3]||0)]; };
  const seasons = [...se].sort((a,b)=>{ const A=sk(a), B=sk(b); return B[0]-A[0] || B[1]-A[1] || B[2]-A[2]; });
  const types = [...ty.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'ko')).map(x=>x[0]);
  return {seasons, types};
}

const cleanUrl = u => { u = unwrapX(u||'').trim(); if(!u) return ''; return 'https://'+u.replace(/^(https?:)?\/+/,''); };
function stockPlanRows(rows){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const items = {}, imgs = {}; let same = 0, changed = 0, notIn = 0; const diffs = [];
  for(const x of rows){
    if(x.img) imgs[x.b] = x.img;
    const st = parseInt(String(x.stock).replace(/[^\d-]/g,''),10), av = parseInt(String(x.avail).replace(/[^\d-]/g,''),10);
    if(isNaN(st) && isNaN(av)) continue;
    items[x.b] = [isNaN(st)?0:st, isNaN(av)?(isNaN(st)?0:st):av];
    const p = byB.get(x.b);
    if(!p){ notIn++; continue; }
    if(String(p.stock)===String(items[x.b][0]) && String(p.avail)===String(items[x.b][1])) same++;
    else { changed++; if(diffs.length<300) diffs.push({p, from:[p.stock, p.avail], to:items[x.b]}); }
  }
  return {items, imgs, n:Object.keys(items).length, same, changed, notIn, diffs};
}
function smRun(text, fileName){
  const r = plParse(text);
  if(r.err){ S.sm = {text: fileName?'':text, fileName, err:r.err}; S.pl = {text:'', res:null}; S.stk = {text:'', res:null}; render(); return; }
  const P = plPlan(r.rows);
  S.sm = {text: fileName?'':text, fileName, err:'', total:r.rows.length, done:{}};
  S.pl = {text:'', fileName, err:'', res:Object.assign(P, {total:r.rows.length, dupIn:r.dupIn})};
  S.stk = {text:'', fileName, err:'', res:stockPlanRows(r.rows)};
  render();
}

// ---------- 같은 제작품명은 가장 최근 이력 공장으로 통일 ----------
function unifyFactories(){
  const grp = new Map();
  for(const p of PRODS.values()){ const k = normK(p.n); if(!k) continue; if(!grp.has(k)) grp.set(k, []); grp.get(k).push(p); }
  for(const ps of grp.values()){
    if(new Set(ps.map(p=>p.curFac)).size < 2) continue;
    let best = null;
    for(const p of ps){
      for(const o of p.orders) if(o.od && (!best || o.od > best.d)) best = {d:o.od, f:o.f};
      for(const c of (p.moves||[])){ const d = String(c.date||c.at||'').slice(0,10); if(d && c.to && (!best || d >= best.d)) best = {d, f:c.to}; }
    }
    if(best) for(const p of ps) if(p.curFac !== best.f){ p.unifiedFrom = p.curFac; p.curFac = best.f; p.facs.add(best.f); }
  }
}

    case 'dueStyle': S.due.q = el.dataset.n; S.showMore = 0; render(); { const t = document.querySelector('#app table'); if(t) t.scrollIntoView({block:'start'}); } break;

    case 'editStyle': S.find.view = 'fix'; S.fix.type = 'every'; S.fix.q = el.dataset.n; S.fix.n = 60; setTab('find'); break;
    case 'fixType': S.fix.type = el.dataset.t; S.fix.n = 60; render(); break;
    case 'fixMore': S.fix.n += 100; render(); break;

    case 'fixOpen': { const p = PRODS.get(el.dataset.k); if(p){ S.find = {q:p.b&&!isNoB(p.b)?p.b:(p.n||p.en), style:styleKey(p)}; setTab('find'); } break; }

      if(n){ toast(n+'개 상품을 채웠습니다'); S.fix.pasteRes = null; S.fix.paste = ''; S.fix.pasteFile = ''; S.fix.pasteMsg = ''; render(); }
      break; }
    case 'saveFac': await saveFac(el.dataset.f); break;

    case 'saveChg': await saveChg(el.dataset.k); break;
    case 'openOrder': orderModal(id); break;
    case 'close': closeModal(); break;

      const o = BYID.get(id); const q = parseInt(val('m_q'),10), d = val('m_d');

      closeModal(); break; }

      const o = BYID.get(id); const eta = val('m_eta'), r = val('m_r'), memo = val('m_memo');
      if(!eta){ toast('새 예정일을 골라주세요'); return; }
      const reason = r+(memo?' · '+memo:'');
      await guard(()=>saveOvr(o, {eta, reason}, {type:'eta', from:o.eta||'', to:eta, msg:'예정일 '+(o.eta?fmtDY(o.eta):'미정')+' → '+fmtDY(eta)+' ('+reason+')'}, label(o)+' 예정일 '+fmtDY(eta)+'로 변경 · '+reason), '일정을 바꿨습니다');
      closeModal(); break; }
    case 'mDel': orderModal(id,'del'); break;
    case 'mCancel': orderModal(id,'cancel'); break;
    case 'doCancel': {
      const o = BYID.get(id); const q = parseInt(val('m_cq'),10); const r = val('m_cr2'); const m = val('m_cm');
      if(!(q>0)){ toast('빼는 수량을 넣어주세요'); break; }
      if(q>o.remain){ toast('남은 수량('+o.remain+'장)보다 많이 뺄 수 없습니다'); break; }
      const reason = r+(m?' · '+m:'');
      const cur = (ovr[o.id]&&Array.isArray(ovr[o.id].cancel))?ovr[o.id].cancel:[];
      await guard(()=>saveOvr(o, {cancel:cur.concat([{q, r:reason, d:TODAY, by:MYID||''}])}, {type:'cancel', msg:q+'장 빼기 ('+reason+')'}, label(o)+' '+q+'장 빼기 · '+reason), q+'장 뺐습니다');
      closeModal(); break; }
    case 'undoRecv': case 'undoCancel': {
      const o = BYID.get(id); const i = +el.dataset.i; const key = a==='undoRecv' ? 'recv' : 'cancel';
      const cur = (ovr[o.id]&&Array.isArray(ovr[o.id][key]))?ovr[o.id][key].slice():[]; const x = cur[i]; if(!x) break;
      cur.splice(i,1);
      await guard(()=>saveOvr(o, {[key]:cur}, {type:'undo', msg:(key==='recv'?'입고 ':'빼기 ')+x.q+'장 되돌림'}, label(o)+' '+(key==='recv'?'입고 ':'빼기 ')+x.q+'장 되돌림'), '되돌렸습니다');
      orderModal(o.id); break; }

      const o = BYID.get(id); const r = val('m_dr');
      await guard(()=>saveOvr(o, {deleted:true, delAt:new Date().toISOString(), delBy:MYID||'', delReason:r, delLabel:label(o)+' ('+nf(o.qty)+'장'+(o.od?' · '+fmtDY(o.od):'')+')', delFac:o.f}, {type:'del', msg:'차수 삭제'+(r?' · '+r:'')}, label(o)+' 차수 삭제'+(r?' · '+r:'')), '차수를 삭제했습니다');
      closeModal(); break; }
    case 'delStyle': delStyleModal(el.dataset.k); break;
    case 'doDelStyle': await doDelStyle(el.dataset.k); break;
    case 'restoreP': await restorePfix(el.dataset.ob); break;
    case 'restoreO': await restoreOrder(el.dataset.id); break;
    case 'doClose': {
      const o = BYID.get(id); const r = val('m_cr');
      await guard(()=>saveOvr(o, {closed:true, closeReason:r}, {type:'close', msg:'마감: '+r+' (잔여 '+o.remain+'장)'}, label(o)+' 마감 · '+r), '마감했습니다');
      closeModal(); break; }
    case 'calPrev': S.cal.m--; if(S.cal.m<0){S.cal.m=11;S.cal.y--;} render(); break;
    case 'calNext': S.cal.m++; if(S.cal.m>11){S.cal.m=0;S.cal.y++;} render(); break;
    case 'calToday': { const d=new Date(); S.cal={y:d.getFullYear(),m:d.getMonth()}; S.calSel=TODAY; render(); break; }
    case 'calDay': S.calSel = (S.calSel===el.dataset.d ? null : el.dataset.d); render(); break;
    case 'pickStyle': S.find.style = el.dataset.k; render(); { const d=document.getElementById('detail'); if(d) d.scrollIntoView({block:'start'}); } break;
    case 'quickReorder': { const p = PRODS.get(el.dataset.b); S.reg.mode='re'; S.reg.ro={q:p.n||p.b, style:styleKey(p), sel:{}}; setTab('reg'); break; }
    case 'syncPreview': { const t = (document.getElementById('syncT')||{}).value||''; S.sync.text = t; S.sync.off = {}; S.sync.res = t.trim() ? roPlan(t) : null; if(!t.trim()) toast('리오더 시트 내용을 붙여넣어 주세요'); render(); break; }
    case 'plCheck': { const t = (document.getElementById('plT')||{}).value||''; if(!t.trim()){ toast('상품 목록을 붙여넣어 주세요'); break; } plRun(t, ''); break; }
    case 'stCheck': { const t = (document.getElementById('stT')||{}).value||''; if(!t.trim()){ toast('셀메이트 재고 목록을 붙여넣어 주세요'); break; } stockRun(t, ''); break; }
    case 'stApply': await stockApply(); break;
    case 'smCheck': { const t = (document.getElementById('smT')||{}).value||''; if(!t.trim()){ toast('셀메이트 목록을 붙여넣어 주세요'); break; } smRun(t, ''); break; }
    case 'tmAdd': await teamAdd(); break;
    case 'tmDel': { if(el.dataset.sure){ await teamDel(el.dataset.e); } else { el.dataset.sure = '1'; el.textContent = '정말 삭제'; el.classList.add('danger'); setTimeout(()=>{ if(el.isConnected){ delete el.dataset.sure; el.textContent = '삭제'; el.classList.remove('danger'); } }, 3000); } break; }
    case 'goHome': setTab('home'); break;
    case 'plClear': S.pl = {text:'', res:null}; render(); break;
    case 'plSave': await plSave(); break;
    case 'syncClear': S.sync = {text:'', res:null, off:{}}; render(); break;
    case 'syncApply': await syncApply(); break;
    case 'regCat': { const C = REG_MENU.find(c=>c.k===el.dataset.c); S.reg.mode = (C.subs.find(x=>x.rec)||C.subs[0]).k; render(); break; }
    case 'rcvOne': { const o = BYID.get(id); const q = parseInt(val('rq_'+id),10), d = val('rd_'+id) || TODAY; if(!(q>0)){ toast('입고 수량을 넣어주세요'); break; } const n = await recvApply([{o, q, d}]); if(n) toast(label(o)+' '+q+'장 입고'); break; }
    case 'rpCheck': { const t = (document.getElementById('rpT')||{}).value||''; S.rcv.paste = t; S.rcv.res = t.trim() ? recvPlan(t) : null; render(); break; }
    case 'rpApply': { const R = S.rcv.res; if(!R) break; const n = await recvApply(R.plan); if(n){ toast(n+'건 입고 처리했습니다'); S.rcv.res = null; S.rcv.paste = ''; render(); } break; }
    case 'regMode': S.reg.mode = el.dataset.m; render(); break;
    case 'nfPasteToggle': keepNew(); S.reg.pasteOpen = !S.reg.pasteOpen; render(); break;
    case 'nfAdd': keepNew(); S.reg.newRows.push({opt:'',b:'',qty:'',eta:''}); render(); break;
    case 'nfDel': keepNew(); S.reg.newRows.splice(+el.dataset.i,1); if(!S.reg.newRows.length) S.reg.newRows.push({opt:'',b:'',qty:'',eta:''}); render(); break;
    case 'nfPaste': {
      keepNew(); const t = val('nf_paste');
      const rows = t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const c=l.split('\t'); return {opt:(c[0]||'').trim(), b:(c[1]||'').trim().replace(/^잔여량-/,''), qty:(c[2]||'').replace(/[^\d]/g,''), eta:''}; });
      if(rows.length){ S.reg.newRows = S.reg.newRows.filter(r=>r.opt||r.b).concat(rows); render(); toast(rows.length+'개 컬러을 채웠습니다'); }
      break; }
    case 'nfSave': await saveNew(); break;
    case 'roPick': S.reg.ro.style = el.dataset.k; S.reg.ro.sel={}; render(); break;
    case 'roClear': S.reg.ro.style = null; render(); break;
    case 'roSave': await saveReorder(); break;
    case 'bulkSave': await saveBulk(); break;
    case 'copyBarcode': copyText(toTable(barcodeTable(),'\t'), '바코드 '+(barcodeTable().length-1)+'개를 복사했습니다. 엑셀에 붙여넣으세요.'); break;
    case 'csvBarcode': saveCsv('입고예정_바코드별_'+TODAY+'.csv', barcodeTable()); break;
    case 'csvOrders': saveCsv('입고예정_차수별_'+TODAY+'.csv', orderTable()); break;
  }
}
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
async function guardN(fn){
  if(!canWrite()){ toast('이 보기에서는 저장할 수 없습니다'); return 0; }
  try{ return await fn(); }catch(e){ toast(errMsg(e)); return 0; }
}
async function guard(fn, okMsg){
  if(!canWrite()){ toast('이 보기에서는 저장할 수 없습니다'); return false; }
  try{ await fn(); toast(okMsg); return true; }catch(e){ toast(errMsg(e)); return false; }
}
function keepNew(){
  const R = S.reg; for(const k of ['nf_c','nf_n','nf_en','nf_od']){ if(document.getElementById(k)) R[k] = val(k); } if(document.getElementById('nf_f')) R.nf_f = facVal('nf_f'); if(document.getElementById('nf_cs')){ R.nf_cs = facVal('nf_cs'); R.nf_ct = facVal('nf_ct'); R.nf_cat = [R.nf_cs, R.nf_ct].filter(Boolean).join(' '); }
  document.querySelectorAll('[data-nr]').forEach(i => { const r = R.newRows[+i.dataset.nr]; if(r) r[i.dataset.k] = i.value.trim(); });
}
async function saveNew(){ if(!need('reg')) return;
  keepNew(); const R = S.reg; const msg = document.getElementById('nfMsg');
  R.newRows.forEach(r=>{ r.opt = String(r.opt||'').replace(/[()]/g,'').replace(/\s*,\s*/g,',').trim().toUpperCase(); });
  let rows = R.newRows.filter(r=>r.opt||r.b||Number(r.qty)>0);
  const errs = [];
  if(!R.nf_f) errs.push('공장을 골라주세요'); if(!R.nf_n) errs.push('제작품명을 넣어주세요');
  rows.forEach(r=>{ r.b = String(r.b||'').trim(); if(r.b && PRODS.has(r.b)) errs.push(r.b+'는 이미 등록된 바코드입니다 → 리오더에서 추가 오더로 넣어주세요'); });
  const dup = rows.map(r=>r.b).filter((b,i,a)=>b && a.indexOf(b)!==i); if(dup.length) errs.push('같은 바코드가 두 번 들어갔습니다: '+dup[0]);
  if(errs.length){ msg.innerHTML = errs.map(e=>'<div class="bad">· '+esc(e)+'</div>').join(''); return; }
  const at = new Date().toISOString();
  if(!rows.length) rows = [{opt:'', b:'', qty:'', eta:''}];
  const stamp = Date.now().toString(36);
  rows = rows.map((r,i)=>Object.assign({}, r, {b: r.b || '바코드없음-'+stamp+(rows.length>1?'-'+(i+1):'')}));
  const ok = await guard(async()=>{
    for(const r of rows){
      await DB.doc('prod/'+safeId(r.b)).set({b:r.b, f:R.nf_f, contact:personName(R.nf_c), n:R.nf_n, en:R.nf_en?(r.opt?R.nf_en+'_'+shortOpt(r.opt.split(',')[0]):R.nf_en):'', opt:r.opt, cat:R.nf_cat, at, by:MYID||''});
      if(Number(r.qty)>0) await DB.collection('ord').add({b:r.b, f:R.nf_f, round:'신상', od:R.nf_od||TODAY, qty:Number(r.qty), eta:r.eta||'', memo:'초두', at, by:MYID||''});
    }
    if(!FACTORIES.includes(R.nf_f)){ await DB.doc('fac/'+facDocId(R.nf_f)).set({name:R.nf_f, kind:'', contact:'', phone:'', memo:'', lead:'', active:true, at, by:MYID||''}); await writeLog('새 공장 '+R.nf_f+' 등록 (신규 상품 등록 중)'); }
    await writeLog('신규 상품 '+R.nf_n+' ('+R.nf_f+') '+(rows.some(r=>r.opt)?'컬러 '+rows.length+'개 ':'')+'등록'+(rows.some(r=>isNoB(r.b))?' · 바코드 나중에 입력':''));
  }, R.nf_n+' 등록 완료');
  if(ok){ const n=R.nf_n; Object.assign(R,{nf_n:'',nf_en:'',nf_cat:'',nf_ct:'',newRows:[{opt:'',b:'',qty:'',eta:''}]}); S.find={q:n,style:null}; render(); }
}
async function saveReorder(){ if(!need('reorder')) return;
  const R = S.reg.ro; const st = STYLES.get(R.style); if(!st) return;
  document.querySelectorAll('[data-ro]').forEach(i=>R.sel[i.dataset.ro]=i.value);
  R.od = val('ro_od'); R.eta = val('ro_eta'); R.memo = val('ro_memo');
  const picks = st.prods.filter(p=>parseInt(R.sel[p.key],10)>0);
  if(!picks.length){ toast('리오더 수량을 하나 이상 넣어주세요'); return; }
  const at = new Date().toISOString();
  const ok = await guard(async()=>{
    for(const p of picks) await DB.collection('ord').add({b:p.b, f:p.curFac, round:nextRound(p), od:R.od||TODAY, qty:parseInt(R.sel[p.key],10), eta:R.eta||'', memo:R.memo||'', at, by:MYID||''});
    await writeLog((st.n||st.en)+' 리오더 '+picks.map(p=>shortOpt(p.opt)+' '+nextRound(p)+' '+R.sel[p.key]+'장').join(', '));
  }, picks.length+'건 리오더 등록 완료');
  if(ok){ S.reg.ro = {q:'',style:null,sel:{}}; S.find={q:st.n||st.en, style:st.key}; setTab('find'); }
}
async function saveBulk(){ if(!need('reorder')) return;
  S.reg.bulk = document.getElementById('bulkT').value; S.reg.bulk_od = val('bulk_od');
  const rows = parseBulk(S.reg.bulk).filter(r=>r.p && r.qty>0);
  const at = new Date().toISOString(); const seen = {};
  const ok = await guard(async()=>{
    for(const r of rows){
      const base = parseInt(nextRound(r.p),10); seen[r.b] = (seen[r.b]||0); const round = (base+seen[r.b])+'차'; seen[r.b]++;
      await DB.collection('ord').add({b:r.b, f:r.p.curFac, round, od:S.reg.bulk_od||TODAY, qty:r.qty, eta:r.eta||'', memo:'', at, by:MYID||''});
    }
    await writeLog('일괄 리오더 '+rows.length+'건 등록 ('+rows.reduce((s,r)=>s+r.qty,0)+'장)');
  }, rows.length+'건 등록 완료');
  if(ok){ S.reg.bulk=''; render(); }
}

// ---------- render ----------
function refresh(){ rebuild(); STYLES = styles(); buildMix(); render(); }
async function setCountry(f, kind){ if(!need('fac','fix')) return;
  if(!kind) return;
  const cur = facDocs[f] || {name:f, contact:'', phone:'', memo:'', lead:'', active:true};
  await guard(async()=>{ await DB.doc('fac/'+facDocId(f)).set(Object.assign({}, cur, {name:f, kind, at:new Date().toISOString(), by:MYID||''})); await writeLog(f+' 국가: '+kind); }, f+' → '+kind);
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
  const st = {connecting:['연결 중','팀 공유 저장소에 연결하는 중입니다'], on:['팀 실시간 공유 중','여기서 입력 · 수정한 내용은 팀원 모두에게 바로 똑같이 보입니다'], off:['보기 전용','로그인하지 않은 보기라 조회만 됩니다. claude.ai에 로그인해 열면 수정할 수 있습니다'], err:['저장소 연결 오류','지금은 저장되지 않습니다. 새로고침 해주세요']}[dbState] || ['',''];
  document.getElementById('foot').innerHTML = '<span>시트 기준 '+esc(SNAP.asof)+'</span>'+(stockAtFull()?'<span>재고 반영 '+esc(stockAtFull())+'</span>':'')+'<span>개발자 변제욱</span>'+(dbState==='err'?'<span style="color:var(--bad)">저장소 연결 오류 · 새로고침 해주세요</span>':'');
  const app = document.getElementById('app');
  const ae = document.activeElement; const fid = ae && ae.id; const pos = fid && ae.selectionStart;
  app.innerHTML = ({home:viewHome, mng:()=>{ S.tab='fac'; S.fac.view='mng'; return viewFac(); }, fac:viewFac, due:viewDue, cal:viewCal, find:viewFind, reg:viewReg, mng:viewMng, fix:viewFix}[S.tab]||viewHome)();
  if(fid){ const e = document.getElementById(fid); if(e){ e.focus(); try{ if(pos!=null) e.setSelectionRange(pos,pos); }catch(x){} } }
  loadThumbs();
}
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b) setTab(b.dataset.tab); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='bg'){ if(e.target===el) closeModal(); return; }
  if(el.tagName==='A') e.preventDefault();
  act(el.dataset.act, el);
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });
let tmr;
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='dueQ'){ S.due.q = t.value; S.showMore=0; clearTimeout(tmr); tmr=setTimeout(render,180); }
  if(t.dataset && t.dataset.fx){ const k = t.dataset.fx; S.fix.edits[k] = S.fix.edits[k]||{}; S.fix.edits[k][t.dataset.k] = t.value; t.classList.add('dirty'); }
  if(t.id==='fixQ'){ S.fix.q = t.value; S.fix.n = 60; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='rcvQ'){ S.rcv.q = t.value; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='rpT'){ S.rcv.paste = t.value; }
  if(t.id==='stT'){ S.stk.text = t.value; }
  if(t.id==='plT'){ S.pl.text = t.value; }
  if(t.id==='smT'){ S.sm.text = t.value; }
  if(t.id==='tmAdd'){ S.team.add = t.value; const b = document.getElementById('tmBox'); if(b) b.innerHTML = teamAddBox(); }
  if(t.id==='syncT'){ S.sync.text = t.value; }
  if(t.id==='fixPaste'){ S.fix.paste = t.value; }
  if(t.id==='mngQ'){ S.mng.q = t.value; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='facQ'){ S.fac.q = t.value; S.fac.n=15; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='findQ'){ S.find.q = t.value; S.find.style=null; S.find.n=300; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='roQ'){ S.reg.ro.q = t.value; S.reg.ro.style=null; clearTimeout(tmr); tmr=setTimeout(render,200); }
  if(t.id==='bulkT'){ S.reg.bulk = t.value; clearTimeout(tmr); tmr=setTimeout(render,400); }
  if(t.dataset && t.dataset.ro){ S.reg.ro.sel[t.dataset.ro] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='dueFac'){ S.due.fac=t.value; S.showMore=0; render(); }
  if(t.id==='dueSt'){ S.due.st=t.value; S.showMore=0; render(); }
  if(t.id==='facSort'){ S.fac.sort=t.value; render(); }
  if(t.dataset && t.dataset.fx){ render(); }
  if(t.dataset && t.dataset.sync!=null){ S.sync.off[t.dataset.sync] = !t.checked; render(); }
  if(t.dataset && t.dataset.plf!=null && S.pl.res){ S.pl.res.fresh[+t.dataset.plf].on = t.checked; render(); }
  if(t.dataset && t.dataset.pld!=null && S.pl.res){ S.pl.res.diff[+t.dataset.pld].on = t.checked; S.pl.diffOpen = true; render(); }
  if(t.dataset && t.dataset.tap){ S.team.perms[t.dataset.tap] = t.checked; }
  if(t.dataset && t.dataset.tmname!=null){ teamSet(t.dataset.tmname, {name:t.value.trim()}); }
  if(t.dataset && t.dataset.tmp){ const m = members[t.dataset.tmp]; if(m){ const pm = Object.assign(ALLP(), m.perms||{}); pm[t.dataset.k] = t.checked; teamSet(t.dataset.tmp, {perms:pm}); } }
  if(t.id==='snapFile' && t.files && t.files[0] && window.__boardAdmin){
    const f = t.files[0]; const pg = x => { const e = document.getElementById('snapProg'); if(e) e.textContent = x; };
    window.__boardAdmin.replaceSnap(f, pg).then(()=>{ pg('교체 완료 · 새로고침합니다…'); setTimeout(()=>location.reload(), 900); }).catch(err=>pg('실패: '+(err.code||err.message)));
  }
  if(t.id==='smFile' && t.files && t.files[0]){
    const f = t.files[0]; const fr = new FileReader();
    fr.onload = () => { const buf = fr.result; let text;
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('euc-kr').decode(buf); }
      smRun(text.replace(/^\ufeff/,''), f.name); };
    fr.readAsArrayBuffer(f);
  }
  if(t.id==='plAll' && S.pl.res){ S.pl.res.fresh.forEach(x=>x.on = t.checked); render(); }
  if(t.id==='stFile' && t.files && t.files[0]){
    const f = t.files[0]; const fr = new FileReader();
    fr.onload = () => { const buf = fr.result; let text;
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('euc-kr').decode(buf); }
      stockRun(text.replace(/^\ufeff/,''), f.name); };
    fr.readAsArrayBuffer(f);
  }
  if(t.id==='fixFile' && t.files && t.files[0]){
    const f = t.files[0]; const fr = new FileReader();
    fr.onload = () => { const buf = fr.result; let text;
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('euc-kr').decode(buf); }
      fixPasteRun(text.replace(/^\ufeff/,''), f.name); };
    fr.readAsArrayBuffer(f);
  }
  if(t.id==='plFile' && t.files && t.files[0]){
    const f = t.files[0]; const fr = new FileReader();
    fr.onload = () => { const buf = fr.result; let text;
      try{ text = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ text = new TextDecoder('euc-kr').decode(buf); }
      plRun(text.replace(/^\ufeff/,''), f.name); };
    fr.readAsArrayBuffer(f);
  }
  if(t.id==='syncAll'){ if(S.sync.res) S.sync.res.plan.forEach((x,i)=>S.sync.off[i] = !t.checked); render(); }
  if(t.id==='rcvFac'){ S.rcv.fac = t.value; render(); }
  if(t.id==='findOpen'){ S.find.onlyOpen = t.checked; S.find.n = 300; render(); }
  if(t.dataset && t.dataset.pcountry){ setStyleCountry([t.dataset.pcountry], t.value); }
  if(t.dataset && t.dataset.scountry){ const st = STYLES.get(t.dataset.scountry); if(st) setStyleCountry(st.prods.map(p=>p.key), t.value); }
  if(t.dataset && t.dataset.facsel){ const i = document.getElementById(t.id+'_new'); if(i){ i.hidden = t.value!=='__new'; if(!i.hidden) i.focus(); } }
  if(t.dataset && t.dataset.country!=null){ setCountry(t.dataset.country, t.value); }
  if(t.id==='mngOff'){ S.mng.showOff=t.checked; render(); }
  if(t.id==='facOpen'){ S.fac.onlyOpen=t.checked; S.fac.n=15; render(); }
  if(t.id==='dueSort'){ S.due.sort=t.value; render(); }
  if(t.id==='bulk_od') S.reg.bulk_od=t.value;
});

refresh();
initCaps();
})();
</script>
