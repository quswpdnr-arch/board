<style>
/* Layout: sticky header with tabs over a single working column; summary first, detail below. */
:root{
  --bg:#f2f4f6; --panel:#ffffff; --sunk:#e9edf1; --fg:#17202c; --muted:#5b6676; --line:#dbe0e6;
  --accent:#0d6a5a; --accent-soft:#dcefe9; --on-accent:#ffffff;
  --bad:#c23a2a; --bad-soft:#fbe4e0; --warn:#a96800; --warn-soft:#fbefd8; --ok:#2b7a4b; --ok-soft:#ddf1e4;
  --info:#4359b0; --info-soft:#e3e8fb; --soon:#7d47b5; --soon-soft:#efe6f9;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --panel:#19202a; --sunk:#141a22; --fg:#e5e9ef; --muted:#97a2b2; --line:#2a3340;
  --accent:#3db49a; --accent-soft:#183a33; --on-accent:#08201b;
  --bad:#ef6b5b; --bad-soft:#3b1f1c; --warn:#e3a83f; --warn-soft:#3a2d16; --ok:#5cc189; --ok-soft:#1a3326;
  --info:#93a6f2; --info-soft:#222a48; --soon:#c39bef; --soon-soft:#2f2342; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#19202a; --sunk:#141a22; --fg:#e5e9ef; --muted:#97a2b2; --line:#2a3340;
  --accent:#3db49a; --accent-soft:#183a33; --on-accent:#08201b;
  --bad:#ef6b5b; --bad-soft:#3b1f1c; --warn:#e3a83f; --warn-soft:#3a2d16; --ok:#5cc189; --ok-soft:#1a3326;
  --info:#93a6f2; --info-soft:#222a48; --soon:#c39bef; --soon-soft:#2f2342; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}

.hmeta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px}
h2{font-size:16px;margin:0;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:700}
.sec{display:grid;gap:12px;margin-bottom:28px;align-content:start}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead .sub{color:var(--muted);font-size:12.5px}
.sechead .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:grid;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .hint{font-size:12px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)} .kpi.soon .val{color:var(--soon)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;line-height:1.7}
.st-late{background:var(--bad-soft);color:var(--bad)} .st-over{background:var(--warn-soft);color:var(--warn)}
.st-soon{background:var(--soon-soft);color:var(--soon)} .st-open{background:var(--info-soft);color:var(--info)}
.st-none{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-done{background:var(--ok-soft);color:var(--ok)} .st-closed{background:var(--sunk);color:var(--muted)}
.kind{font-size:11px;color:var(--muted)} .kind.fixed{color:var(--fg);font-weight:600}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.01em;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
.pname{font-weight:600} .pname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.btn{appearance:none;font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{font-size:12px;padding:3px 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;min-width:0}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12.5px}
input[type=search]{min-width:220px;flex:1 1 220px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{color:var(--fg)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.dlist{display:grid}
.drow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;padding:9px 16px;border-top:1px solid var(--line);align-items:start;cursor:pointer}
.drow:first-child{border-top:0} .drow:hover{background:var(--sunk)}
.drow .d{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.drow .d small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.bars{display:grid;gap:7px;padding:14px 16px}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;cursor:pointer}
.bar .tr{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fi{height:100%;background:var(--accent);border-radius:3px}
.bar .fi.late{background:var(--bad)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font-size:12px;font-weight:600;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .day{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--panel)}
.cal .day.out{background:var(--sunk)} .cal .day.out .dn{opacity:.45}
.cal .day.today .dn{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 7px}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-size:12px;font-weight:700;align-self:flex-start;font-variant-numeric:tabular-nums}
.ev{font-size:11.5px;line-height:1.35;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.exp{background:var(--info-soft);color:var(--info)} .ev.fixed{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ev.lateev{background:var(--bad-soft);color:var(--bad)} .ev.rcv{background:var(--ok-soft);color:var(--ok)}
.ev.more{color:var(--muted);background:none;padding:0 5px}
@media (max-width:640px){.cal .day{min-height:64px}.ev:not(.sum){display:none}.ev.sum{display:block}}
@media (min-width:641px){.ev.sum{display:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.rlist{display:flex;gap:4px;flex-wrap:wrap}
.rc{font-size:11.5px;background:var(--ok-soft);color:var(--ok);padding:0 6px;border-radius:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc.add{background:var(--accent-soft);color:var(--accent)}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.res{padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:2px}
.res:hover,.res.on{border-color:var(--accent)}
.res .t{font-weight:700} .res .s{font-size:12px;color:var(--muted)}
.opthead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.banner{padding:10px 14px;border-radius:8px;font-size:13px;background:var(--warn-soft);color:var(--warn);margin-bottom:16px}
.banner.info{background:var(--info-soft);color:var(--info)}
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);display:grid;gap:14px;padding:18px}

.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.loglist{display:grid;font-size:12.5px}

a.plink,a.flink{color:inherit;text-decoration:none;cursor:pointer}a.plink:hover,a.flink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.odsub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.qback{flex:none;white-space:nowrap}
.whs{display:block;font-size:10.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.mstk span small+small{font-size:10px}
.catsel{display:block;margin-top:4px;font-size:11px;padding:1px 18px 1px 6px;min-height:0;height:auto;width:auto;border-radius:6px;color:var(--muted);background-color:var(--sunk)}
.rvc.all{width:auto;padding:0 6px}
.brandsw{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel);margin-left:auto}
.bsw{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.bsw.on{background:var(--fg);color:var(--bg)}
.brandsw + .acct{margin-left:12px}
.wordmark{font-family:"Didot","Bodoni 72","Playfair Display","Times New Roman",serif;font-weight:500;letter-spacing:.02em;font-size:17px;line-height:1;color:var(--fg)}
.wm-tid{font-stretch:condensed;letter-spacing:-.01em;transform:scaleX(.82);transform-origin:left;display:inline-block}
.wm-frv{letter-spacing:.04em}
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:980px){.bcards{grid-template-columns:1fr}}
.bcard{display:grid;gap:12px}.bcard.off{opacity:.6}
.bchead{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.bchead .wordmark{font-size:21px}.blogo{width:150px;height:16px}
.bcnums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bcnums div{display:grid;gap:2px;min-width:0;background:var(--sunk);border-radius:10px;padding:8px 9px}
.bcnums span{font-size:11px;color:var(--muted)}.bcnums b{font-size:17px;white-space:nowrap;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.bcnums b small{font-size:11px;font-weight:500;margin-left:1px;color:var(--muted)}
.bcnums em{font-style:normal;font-size:11px;color:var(--muted)}.bcnums .bad b{color:var(--bad)}.bcnums .soon b{color:var(--warn)}
.bcmeta{margin:0;font-size:11.5px}
body.mode-all #tabs{display:none}
.alltbl{min-width:780px}.alltbl td:first-child,.alltbl td:nth-child(2){white-space:nowrap}
.bempty{display:grid;gap:10px;justify-items:center;text-align:center;padding:48px 20px}.bempty h2{margin:6px 0 0;font-size:17px}
@media (max-width:640px){.hrow{flex-wrap:wrap;gap:8px}.brandsw{margin-left:0;order:3;width:100%;justify-content:space-between}.bsw{flex:1;padding:5px 6px}}
.rvcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:8px;margin-bottom:12px}
.rvcard{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;font:inherit;color:inherit}.rvcard small{grid-column:1/-1}
.rvcard b{font-size:18px}.rvcard small{font-size:11px;color:var(--muted);line-height:1.3}.rvcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.rvtbl td{vertical-align:top}.rvtbl td:first-child{min-width:220px}.rvtbl td.rvmemo{min-width:140px}.rvtbl tr.rvneed td:first-child{box-shadow:3px 0 0 var(--accent) inset}
.rvsel{font-size:12.5px;padding:3px 22px 3px 8px;min-height:0;height:auto;width:auto;border-radius:8px;font-weight:600}
.rvround{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);margin:0 4px 4px 0;white-space:nowrap}.rvround.bad{border-color:var(--bad);color:var(--bad)}
.rvch{display:inline-flex;gap:2px;flex-wrap:nowrap}.rvc{font:inherit;font-size:10.5px;width:21px;height:21px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:0}.rvc.on{background:var(--ok);border-color:var(--ok);color:#fff}
.rvmemo small{display:block;font-size:11.5px;max-width:180px;line-height:1.4}
a.rvinc{cursor:pointer;color:inherit;text-decoration:none;white-space:nowrap}a.rvinc:hover{color:var(--accent)}
.rvrows{display:grid;gap:6px}.rvr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.rvr.done{opacity:.55}.rvr input[data-k=memo]{flex:1;min-width:140px}.rvr .bad{color:var(--bad);font-size:11.5px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}.tchip.dup{opacity:.55;text-decoration:line-through}
.tperm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}.tperm label{display:inline-flex;gap:5px;align-items:center}
.ttbl td.c,.ttbl th.c{text-align:center}.ttbl .tname{width:120px}.ttbl .tname.need{border-color:var(--accent)}.ttbl tr.tadmin td{color:var(--muted)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.rt .lock{font-style:normal;font-size:11px;margin-left:6px;opacity:.7}
.smsec{margin-top:14px}
.acct{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.acct:empty{display:none}
.cfield{display:inline-flex;align-items:center;gap:5px;margin-left:10px;color:var(--muted)}
.csel{font-size:12px;padding:2px 22px 2px 7px;min-height:0;height:auto;width:auto;border-radius:6px}
.nform label.key>span:first-child,.nhead .key{color:var(--fg);font-weight:700}
.nform label.key>span:first-child::after,.nhead .key::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:2px}
.req{font-style:normal;vertical-align:1px;font-size:10.5px;font-weight:700;color:var(--bad);margin-left:3px}
.nmore summary{cursor:pointer;font-size:13px;font-weight:600}
.ntable{display:grid;gap:6px}
.nrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr) 100px 150px 34px;gap:8px;align-items:center}

<script type="text/plain" id="app-src">
(function(){
'use strict';

let BRAND = 'kb';
try{ BRAND = localStorage.getItem('kb_brand') || 'kb'; }catch(e){ const m = /kbb=(\w+)/.exec(window.name||''); if(m) BRAND = m[1]; }

const snapEl = id => { const e = document.getElementById(id); const t = e ? e.textContent.trim() : ''; return t && (t[0]==='{' || t[0]==='[') ? t : null; };

const SNAP_TXT = snapEl('snap_'+BRAND) || snapEl('snap');
const SNAP = JSON.parse(SNAP_TXT);
const LEAD = SNAP.lead;

const INACTIVE = new Set(Object.keys(FMETA).filter(f=>FMETA[f].inactive)); // 원본의 '(진행안함)' 시트
const pad = n => String(n).padStart(2,'0');

const diffDays = (a,b) => Math.round((new Date(a+'T00:00:00') - new Date(b+'T00:00:00'))/864e5);
const DOW = ['일','월','화','수','목','금','토'];

const fmtDY = s => s ? s.slice(2).replace(/-/g,'.') : '';
const nf = n => Number(n||0).toLocaleString('ko-KR');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeId = s => String(s).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,120);
const ST = {late:'지연',over:'예상일 경과',soon:'7일 내 입고',open:'진행 중',none:'일정 미정',done:'입고 완료',closed:'마감'};
const REASONS = ['원단 수급 지연','공장 생산 지연','검수/불량 재작업','부자재 지연','물류/통관 지연','오더 수량 변경','기타'];

// ---------- state ----------
let DB = null, RAWDB = null, USER = null, MYID = null, dbState = 'connecting';
function brandDB(raw){ if(BRAND==='kb' || BRAND==='all') return raw; const P = p => /^(members|users)(\/|$)/.test(p) ? p : 'brands/'+BRAND+'/'+p; return {collection: p => raw.collection(P(p)), doc: p => raw.doc(P(p))}; }
let newProds = {}, newOrds = {}, ovr = {}, logs = [], facDocs = {}, fchgs = [], pfixDocs = {}, stockDoc = null;
let PRODS, ORDERS, BYID, FACTORIES;
const S = {
  tab: 'home',
  due: {fac:'', st:'open', q:'', sort:'eta'},
  cal: null, calSel: null,
  find: {q:'', style:null, n:300, onlyOpen:false, view:'list'},
  fac: {f:'', q:'', sort:'recent', onlyOpen:false, n:15, view:'list'},
  mng: {q:'', showOff:false},
  fix: {type:'all', q:'', edits:{}, n:60, paste:'', pasteRes:null, pasteMsg:''},
  sync: {text:'', res:null, off:{}},
  stk: {text:'', res:null},
  rcv: {q:'', fac:'', paste:'', res:null},
  pl: {text:'', res:null},
  sm: {},
  rv: {q:'', st:'', fac:'', cat:'', act:'', all:false, n:150},
  team: {add:'', perms:{reorder:true,recv:true,reg:true,stock:true,resv:true,fix:true,fac:true}},
  reg: {mode:'sync', newRows:[{opt:'',b:'',qty:'',eta:''}], ro:{q:'', style:null, sel:{}}, bulk:''},
  showMore: 0
};
{ const d = new Date(); S.cal = {y:d.getFullYear(), m:d.getMonth()}; }
try { const t = localStorage.getItem('kb_tab'); if (t==='fix'){ S.tab='find'; S.find.view='fix'; } else if (t==='mng'){ S.tab='fac'; S.fac.view='mng'; } else if (t && t!=='cal') S.tab = t; } catch(e){}

// ---------- model ----------
const TITLE_RE = /\s*(대리|과장|과징|실장|차장|부장|팀장|대표|주임|사원|디자이너|매니저|이사|사장|선생)\s*님?\s*$/;
function personName(c, f){
  let x = String(c||'').split('/').pop().replace(/\(.*?\)/g,'').trim();
  if(f && (x===f || x.replace(/\s/g,'')===String(f).replace(/\s/g,''))) return '';
  x = x.replace(TITLE_RE,'').replace(/님$/,'').trim();
  if(RETIRED.has(x)) return '';
  return /[가-힣A-Za-z]/.test(x) ? x : '';
}
const RETIRED = new Set(['문지애','김예주']);
const facDocId = n => 'f_'+Array.from(String(n)).map(c=>c.codePointAt(0).toString(16)).join('_');
function facInfo(f){
  const d = facDocs[f] || {}; const m = FMETA[f] || {};
  return {name:f, kind:(d.kind!=null && d.kind!=='' ? d.kind : (m.kind||'')), contact:personName(d.contact||''), phone:d.phone||'', memo:d.memo||'', lead:(d.lead!=null&&d.lead!=='')?Number(d.lead):null,
    active: d.active!=null ? !!d.active : !m.inactive, staff:[...new Set((m.contacts||[]).map(x=>personName(x,f)).filter(Boolean))].slice(0,3), isNew:!FMETA[f], doc:!!facDocs[f]};
}
// 리드타임 = 오더일 → 첫 입고일까지 걸린 날짜의 평균 (상품 → 공장 → 전체 순)
let LT = {s:new Map(), f:new Map(), all:LEAD._all};
const ltKey = p => normK(p.n||p.en||p.b);
function buildLead(){
  const S1 = new Map(), F1 = new Map(), A = [];
  const push = (m,k,v) => { if(!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for(const o of ORDERS){
    if(!o.od) continue;
    const ds = o.rc.map(r=>r.d).concat(o.rcAdd.map(r=>r.d)).filter(Boolean).sort();
    if(!ds.length) continue;
    const days = Math.round((new Date(ds[0]) - new Date(o.od)) / 864e5);
    if(!(days>=1 && days<=365)) continue;
    push(S1, ltKey(o.p), days); push(F1, o.f0, days); A.push(days);
  }
  const avg = a => [Math.round(a.reduce((x,y)=>x+y,0)/a.length), a.length];
  LT = {s:new Map([...S1].map(([k,a])=>[k,avg(a)])), f:new Map([...F1].map(([k,a])=>[k,avg(a)])), all: A.length ? avg(A) : LEAD._all};
}
function leadFor(f){ const i = facInfo(f); return i.lead!=null && !isNaN(i.lead) ? i.lead : (LT.f.get(f) || LT.all)[0]; }
function leadInfo(p, f){
  const s1 = p && LT.s.get(ltKey(p));
  if(s1) return {d:s1[0], src:'이 상품 지난 입고 '+s1[1]+'회 평균'};
  const i = facInfo(f);
  if(i.lead!=null && !isNaN(i.lead)) return {d:i.lead, src:f+' 직접 설정'};
  const f1 = LT.f.get(f);
  if(f1) return {d:f1[0], src:f+' 지난 입고 '+f1[1]+'회 평균'};
  return {d:LT.all[0], src:'전체 공장 평균'};
}
const activeFacs = () => FACTORIES.filter(f=>facInfo(f).active);
function getProd(b, f, info){
  const key = b || ('nob:'+f+':'+(info&&info.n||''));
  let p = PRODS.get(key);
  if(!p){ p = {key, b, facs:new Set(), contact:'', n:'', en:'', opt:'', cat:'', orders:[], isNew:false, home:f, curFac:f, moves:[], origBs:new Set()}; PRODS.set(key,p); }
  if(f) p.facs.add(f);
  if(info){ if(info.contact) info = Object.assign({}, info, {contact:personName(info.contact, f)}); for(const k of ['contact','n','en','opt','cat']) if(!p[k] && info[k]) p[k]=info[k]; }
  return p;
}
let CHG = new Map();
function rebuild(){
  PRODS = new Map(); ORDERS = []; BYID = new Map();
  const facs = new Set();
  CHG = new Map();
  for(const c of fchgs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.at||'').localeCompare(b.at||''))){
    for(const b of (c.bs||[])){ if(!CHG.has(b)) CHG.set(b,[]); CHG.get(b).push(c); }
  }
  const ALIAS = {}; for(const [ob,d] of Object.entries(pfixDocs)) if(d && d.b) ALIAS[ob] = d.b;
  const AB = b => ALIAS[b] || b;
  SNAP.orders.forEach((r,i) => {
    const pp = SNAP.products[r[0]];
    if((pfixDocs[pp[0]]||{}).deleted || (ovr['s'+i]||{}).deleted) return;
    const p = getProd(AB(pp[0]), pp[1], {contact:pp[2], n:pp[3], en:pp[4], opt:pp[5], cat:pp[6]});
    if(pp[7]){ p.sysFac = pp[7]; p.stock = pp[8]; p.avail = pp[9]; }
    const W = (SNAP.wh||{})[pp[0]]; if(W){ p.trans = W[0]; p.hq = W[1]; p.unsent = W[2]; }
    p.origBs.add(pp[0]);
    facs.add(pp[1]);
    addOrder({id:'s'+i, p, f:pp[1], round:r[1], od:r[2], qty:r[3], eta0:r[4], etaText:r[5], recv0:r[6], rem0:r[7],
      rc:r[8].map(x => ({q:x[0], d:x[1]||'', l:x[2]||''})), memo:r[9], src:'snap'});
  });
  for(const [id,np] of Object.entries(newProds)){
    if((pfixDocs[np.b]||{}).deleted) continue;
    const p = getProd(AB(np.b), np.f, np); p.isNew = true; p.origBs.add(np.b); facs.add(np.f); if(np.img) p.img = np.img;
    if(np.sysFac){ p.sysFac = np.sysFac; p.stock = np.stock; p.avail = np.avail; }
  }
  for(const [id,no] of Object.entries(newOrds)){
    if((pfixDocs[no.b]||{}).deleted || (ovr['n_'+id]||{}).deleted) continue;
    const p = getProd(AB(no.b), no.f, null); p.origBs.add(no.b); facs.add(no.f);
    addOrder({id:'n_'+id, dbid:id, p, f:no.f, round:no.round, od:no.od||'', qty:Number(no.qty)||0, eta0:no.eta||'', etaText:'',
      recv0:0, rem0:Number(no.qty)||0, rc:[], memo:no.memo||'', src:'db', at:no.at, by:no.by});
  }
  for(const n of Object.keys(facDocs)) facs.add(n);
  for(const c of fchgs) if(c.to) facs.add(c.to);
  const SI = stockLive() ? stockDoc.items : null;
  for(const p of PRODS.values()){
    for(const ob of p.origBs){ const d = pfixDocs[ob]; if(!d) continue; for(const k of ['n','en','opt','cat','country']) if(d[k]) p[k] = d[k]; }
    if(SI){ const it = SI[p.b] || [...p.origBs].map(b=>SI[b]).find(Boolean); if(it){ p.stock = it[0]; p.avail = it[1]; if(it.length>2){ p.trans = it[2]; p.hq = it[3]; p.unsent = it[4]; } } }
  }
  buildLead();
  for(const o of ORDERS) if(o.etaKind==='est'){ const li = leadInfo(o.p, o.f); o.eta = addDays(o.od, li.d); o.leadSrc = li.src; o.status = statusOf(o); }
  const rnum = r => { const m = /(\d+)/.exec(r||''); return m ? +m[1] : 0; };
  for(const p of PRODS.values()){
    p.orders.forEach((o,i)=>o._i=i);
    p.orders.sort((a,b)=> rnum(a.round)-rnum(b.round) || (a.od||'').localeCompare(b.od||'') || a._i-b._i);
    // 시트가 공장별로 나뉘어 있던 이관 이력 (같은 바코드가 두 공장 시트에 있음)
    p.autoMoves = [];
    let prev = null;
    for(const o of p.orders){ if(prev && o.f0!==prev.f0) p.autoMoves.push({from:prev.f0, to:o.f0, date:o.od||'', auto:true}); prev = o; }
    if(p.orders.length) p.curFac = p.orders[p.orders.length-1].f;
    const cs = CHG.get(p.b) || [];
    if(cs.length){ p.moves = cs; p.curFac = cs[cs.length-1].to; p.facs.add(p.curFac); }
  }
  unifyFactories();
  FACTORIES = [...facs].filter(Boolean);
}
function facForOrder(o, open){
  let f = o.f;
  for(const c of (CHG.get(o.p.b)||[])){
    if(o.src==='db' && o.f===c.to) continue;
    if((o.od && c.date && o.od >= c.date) || (c.open && open)) f = c.to;
  }
  return f;
}
function addOrder(o){
  const v = ovr[o.id] || {};
  const add = Array.isArray(v.recv) ? v.recv : [];
  o.rcAdd = add.map(x => ({q:Number(x.q)||0, d:x.d||'', by:x.by, add:true}));
  const addQ = o.rcAdd.reduce((s,x)=>s+x.q,0);
  o.recv = o.recv0 + addQ;
  if(v.qty!=null && v.qty!==''){ o.qty = Number(v.qty); o.rem0 = Math.max(0, o.qty - o.recv0); }
  const inactive = INACTIVE.has(o.f) && !v.closed && o.src==='snap';
  const zero = !v.closed && o.qty===0 && o.recv===0;
  o.closed = !!v.closed || inactive || zero; o.closeReason = v.closeReason || (inactive ? '진행안함 시트' : (zero ? '수량 0' : ''));
  o.cancels = (Array.isArray(v.cancel) ? v.cancel : []).map(x=>({q:Number(x.q)||0, r:x.r||'', d:x.d||'', by:x.by}));
  const cq = o.cancels.reduce((s,x)=>s+x.q,0); o.cancelQ = cq;
  o.remain = o.closed ? 0 : Math.max(0, o.rem0 - addQ - cq);
  if(!o.closed && cq>0 && o.remain===0 && o.recv===0){ o.closed = true; o.closeReason = '전량 취소 · '+(o.cancels[o.cancels.length-1].r||''); }
  o.f0 = o.f; o.f = facForOrder(o, o.remain>0);
  o.changes = Array.isArray(v.log) ? v.log : [];
  o.etaReason = v.reason || '';
  if(v.eta){ o.eta = v.eta; o.etaKind = 'fixed'; }
  else if(o.eta0){ o.eta = o.eta0; o.etaKind = 'fixed'; }
  else if(o.od && o.remain>0){ o.eta = addDays(o.od, leadFor(o.f)); o.etaKind = 'est'; }
  else { o.eta = ''; o.etaKind = ''; }
  o.firstEta = (o.changes.find(c=>c.type==='eta')||{}).from || '';
  o.status = statusOf(o);
  o.p.orders.push(o); ORDERS.push(o); BYID.set(o.id, o);
}
function statusOf(o){
  if(o.closed) return 'closed';
  if(o.remain<=0) return 'done';
  if(!o.eta) return 'none';
  if(o.eta < TODAY) return o.etaKind==='fixed' ? 'late' : 'over';
  if(o.eta <= addDays(TODAY,7)) return 'soon';
  return 'open';
}
const isOpen = o => o.remain>0 && !o.closed;
function nextRound(p){
  let mx = 0; for(const o of p.orders){ const m = /^(\d+)\s*차/.exec(o.round); if(m) mx = Math.max(mx, +m[1]); }
  return (mx+1)+'차';
}
function styleKey(p){ return p.curFac+'|'+(p.n||p.en||p.b); }
function styles(){
  const m = new Map();
  for(const p of PRODS.values()){
    const k = styleKey(p);
    if(!m.has(k)) m.set(k,{key:k, f:p.curFac, n:p.n, en:(p.en||'').replace(/_[^_]*$/,''), cat:p.cat, contact:p.contact, prods:[]});
    m.get(k).prods.push(p);
  }

}
let STYLES;

// ---------- db ----------
async function initCaps(){
  if(!window.claude || !window.claude.use){ dbState='off'; render(); return; }
  const timer = setTimeout(()=>{ if(dbState==='connecting'){ dbState='off'; render(); } }, 10000);
  try{
    RAWDB = await window.claude.use('db'); DB = RAWDB ? brandDB(RAWDB) : null;
    USER = await window.claude.use('user');
    if(USER){ try{ MYID = await USER.id(); }catch(e){}
      try{ ME.admin = !!(USER.isOwner && USER.isOwner()); }catch(e){}
      try{ const m = await USER.me(); ME.email = String((m && m.email) || '').toLowerCase(); ME.name = (m && m.name) || ''; }catch(e){} }
  }catch(e){ DB = null; }
  if(!DB){ clearTimeout(timer); dbState='off'; render(); return; }
  if(BRAND==='all') watchSums();
  let got = 0; const need = 8;
  const ready = () => { got++; if(got>=need){ clearTimeout(timer); dbState='on'; } refresh(); };
  const fail = e => { clearTimeout(timer); dbState='err'; toast('저장소 연결 오류: '+(e&&e.message||'')); render(); };

function barcodeRows(){
  const m = new Map();
  for(const o of filteredDue().filter(isOpen)){
    const k = o.p.b || o.p.key;
    const r = m.get(k) || {b:o.p.b, n:o.p.n, en:o.p.en, opt:o.p.opt, f:new Set(), q:0, eta:'', rounds:[], stock:hasStock(o.p)?o.p.stock:'', avail:hasStock(o.p)?availIn(o.p):''};
    r.f.add(o.f); r.q += o.remain; if(o.eta && (!r.eta || o.eta<r.eta)) r.eta=o.eta; r.rounds.push(o.round);
    m.set(k,r);

}

function parseBulk(t){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b && !byB.has(p.b)) byB.set(p.b,p);
  return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const c = l.split(/\t|,(?=\s*\d)|\s{2,}/).map(x=>x.trim());
    const b = c[0].replace(/^잔여량-/,''); const qty = parseInt(String(c[1]||'').replace(/[^\d]/g,''),10)||0;
    let eta = (c[2]||'').replace(/[./]/g,'-'); if(!/^\d{4}-\d{2}-\d{2}$/.test(eta)) eta='';
    return {b, qty, eta, p:byB.get(b)};
  });
}

function facRows(){
  const fs = {};
  for(const f of FACTORIES) fs[f] = {f, styles:new Set(), open:0, rem:0, late:0, last:''};
  for(const o of ORDERS){ const x = fs[o.f]; if(!x) continue; if(o.od && o.od>x.last) x.last=o.od; if(isOpen(o)){ x.open++; x.rem+=o.remain; if(o.status==='late'||o.status==='over') x.late++; } }
  for(const st of STYLES.values()){ const x = fs[st.f]; if(x) x.styles.add(st.key); }
  return FACTORIES.map(f=>Object.assign(fs[f], {i:facInfo(f)}));
}

function issuesOf(p){

    msgs.push((p.n||p.en||p.b)+' '+shortOpt(p.opt)+' · '+Object.entries(patch).map(([f,v])=>FLAB[f]+' '+v).join(', ')); n++;

}
function parsePasteList(t){
  const sm = plParse(t);
  if(!sm.err && sm.rows.length) return {rows: sm.rows.map(x=>({b:x.b.replace(/^잔여량-/,''), en:x.en, opt:x.opt, n:x.n, cat:x.cat})), sellmate:true};
  return parsePasteSimple(t);
}
function fixPasteRun(text, fileName){
  const X = S.fix; X.pasteOpen = true; X.pasteFile = fileName||''; X.paste = fileName ? '' : text;
  const r = parsePasteList(text);
  if(r.err){ X.pasteRes = null; X.pasteMsg = r.err; } else { X.pasteRes = matchPaste(r.rows); X.pasteMsg = (r.sellmate?'셀메이트 양식으로 ':'')+nf(r.rows.length)+'줄을 읽었습니다.'+(X.pasteRes.length?'':' 비어 있는 칸을 채울 상품을 찾지 못했습니다.'); }

}
function parsePasteSimple(t){
  const lines = t.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return {err:'머리글 줄과 상품 줄을 함께 붙여넣으세요.'};
  const head = lines[0].split('\t').map(x=>x.trim());
  const find = (...names) => head.findIndex(h=>names.some(n=>h.replace(/\s/g,'').includes(n)));
  const ib = find('바코드'), io = find('옵션'), im = find('사입상품명','제작품명','작지명'), ic = find('분류');
  let ie = head.findIndex((h,i)=>/상품명/.test(h) && i!==im);
  if(ib<0 && im<0) return {err:'머리글에서 "바코드" 또는 "제작품명" 열을 찾지 못했습니다.'};
  const rows = lines.slice(1).map(l=>{ const c = l.split('\t'); const g = i => i>=0 ? String(c[i]||'').trim() : '';
    return {b:g(ib).replace(/^잔여량-/,''), en:g(ie), opt:g(io), n:g(im), cat:g(ic)}; });
  return {rows};
}
function matchPaste(rows){
  const byB = new Map(), byNO = new Map();
  for(const r of rows){ if(r.b) byB.set(r.b, r); if(r.n && r.opt) byNO.set(normK(r.n)+'|'+normK(r.opt), r); }
  const out = [];
  for(const p of PRODS.values()){
    const iss = issuesOf(p); if(!iss.length) continue;
    const r = (!isNoB(p.b) && byB.get(p.b)) || byNO.get(normK(p.n)+'|'+normK(p.opt));
    if(!r) continue;
    const patch = {};
    if(isNoB(p.b) && r.b && !PRODS.has(r.b)) patch.b = r.b;
    if(isNoB(p.b) && r.b && PRODS.has(r.b)) patch.b = r.b;
    if(!p.n && r.n) patch.n = r.n;
    if(!p.en && r.en) patch.en = r.en;
    if(!p.cat && r.cat) patch.cat = r.cat;
    if(!/,/.test(p.opt||'') && r.opt && /,/.test(r.opt)) patch.opt = r.opt;
    if(Object.keys(patch).length) out.push({p, patch});
  }
  return out;
}

// ---------- 리오더 시트 붙여넣기 동기화 ----------
// 구글 시트에서 복사한 내용(탭 구분, 줄바꿈 있는 칸은 "..."로 감싸짐)을 표로 읽는다
function parseTSV(t){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(q){
      if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
    } else if(c==='"' && cell===''){ q = true; }
    else if(c==='\t'){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
// 양식 기본 열 순서 (머리글 없이 값만 붙여넣을 때)
const RO_DEFAULT = {od:0, b:1, staff:2, f:3, caution:4, en:5, opt:6, n:7, on:8, off:9, sum:10, eta:11, reason:12, resv:13, memo:14};
function roCols(rows){
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r = rows[i].map(x=>String(x||'').replace(/\s/g,''));
    const ib = r.findIndex(x=>x==='바코드'), io = r.findIndex(x=>x.startsWith('리오더날짜'));
    if(ib>=0 && io>=0){
      const f = (...ks) => r.findIndex(x=>ks.some(k=>x.startsWith(k)));
      return {start:i+1, cols:{od:io, b:ib, staff:f('담당'), f:f('공장'), caution:f('주의'), en:f('상품명'), opt:f('옵션'), n:f('사입상품명','제작품명'), on:f('온라인'), off:f('오프라인'), sum:f('합계'), eta:f('입고일정'), reason:f('일정변경'), resv:f('예약배송'), memo:f('비고')}, header:true};
    }
  }
  return {start:0, cols:RO_DEFAULT, header:false};
}
function excelSerial(n){ const d = new Date(Date.UTC(1899,11,30)); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function parseDay(s, ref){
  s = String(s||'').trim(); if(!s) return '';
  let m;
  if(/^\d{5}(\.\d+)?$/.test(s)) return excelSerial(Math.floor(+s));
  if((m = /(\d{4})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/.exec(s))) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m = /^(\d{2})(\d{2})(\d{2})$/.exec(s))) return '20'+m[1]+'-'+m[2]+'-'+m[3];
  if((m = /(\d{1,2})\s*[/.월]\s*(\d{1,2})/.exec(s))){
    const r = ref ? new Date(ref+'T00:00:00') : new Date(); let y = r.getFullYear(); const mo = +m[1];
    if(mo < r.getMonth()+1-2) y++;
    if(mo>12 || +m[2]>31) return '';
    return y+'-'+pad(mo)+'-'+pad(+m[2]);
  }
  return '';
}
// 입고일정 칸 → 날짜 하나 + 메모 ('11/11 -> 11/9' 는 마지막, '1차 94장 11/13 2차 56장 11/19' 는 첫 날짜)
function parseEta(s, od){
  s = String(s||'').trim(); if(!s) return {eta:'', note:''};
  if(/^\d{5}(\.\d+)?$/.test(s)) return {eta:excelSerial(Math.floor(+s)), note:''};
  const full = /(\d{4})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})/g; let all = [], m;
  while((m = full.exec(s))) all.push(m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]));
  if(!all.length){ const md = /(\d{1,2})\s*\/\s*(\d{1,2})/g; while((m = md.exec(s))) all.push(parseDay(m[0], od)); all = all.filter(Boolean); }
  if(!all.length) return {eta:'', note:s.replace(/\s+/g,' ')};
  const changed = /->|→|>/.test(s);
  const eta = changed ? all[all.length-1] : all[0];
  const note = (all.length>1 || /[가-힣]/.test(s)) ? s.replace(/\s+/g,' ') : '';
  return {eta, note};
}
function roPlan(text){
  const rows = parseTSV(text); const {start, cols, header} = roCols(rows);
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const g = (r,k) => cols[k]>=0 && cols[k]!=null ? String(r[cols[k]]||'').trim() : '';
  const plan = [], miss = [], seen = new Set(); let same = 0, skipped = 0, dup = 0;
  for(const r of rows.slice(start)){
    const b = g(r,'b').replace(/^잔여량-/,''); const od = parseDay(g(r,'od'));
    const sum = parseInt(g(r,'sum').replace(/[^\d]/g,''),10);
    const qty = sum>0 ? sum : ((parseInt(g(r,'on').replace(/[^\d]/g,''),10)||0) + (parseInt(g(r,'off').replace(/[^\d]/g,''),10)||0));
    if(!b || !od || !(qty>0)){ if(b||od) skipped++; continue; }
    const key = b+'|'+od+'|'+qty; if(seen.has(key)){ dup++; continue; } seen.add(key);
    const {eta, note} = parseEta(g(r,'eta'), od);
    const reason = [note, g(r,'reason'), g(r,'caution')].filter(Boolean).join(' / ');
    const memoRaw = g(r,'memo'); const done = /입고\s*완료/.test(memoRaw); const part = /^\d+$/.test(memoRaw) ? +memoRaw : 0;
    const p = byB.get(b);
    if(!p){ miss.push({b, od, qty, n:g(r,'n'), opt:g(r,'opt'), f:g(r,'f')||g(r,'staff')}); continue; }
    const cands = p.orders.filter(o=>o.od===od);
    const o = cands.find(x=>x.qty===qty) || cands[0];
    if(!o){
      plan.push({type:'new', p, od, qty, eta, reason, done, part, label:'신규 리오더', text:nf(qty)+'장 · '+nextRound(p)+(eta?' · 예정 '+fmtDY(eta):'')+(done?' · 입고완료':'')+(reason?' · '+reason:'')});
      continue;
    }
    const ch = []; const patch = {}; const logs = [];
    if(qty!==o.qty){ patch.qty = qty; ch.push('수량 '+nf(o.qty)+' → '+nf(qty)); logs.push({type:'qty', msg:'수량 '+o.qty+' → '+qty+' (리오더 시트)'}); }
    const curFixed = o.etaKind==='fixed' ? o.eta : '';
    let shift = '';
    if(eta && eta!==curFixed && isOpen(o)){
      const dd = curFixed ? diffDays(eta, curFixed) : 0;
      shift = !curFixed ? 'set' : (dd>0 ? 'late' : 'early');
      const tag = shift==='set' ? '일정 확정' : (shift==='late' ? '일정 지연 예정 +'+dd+'일' : '조기 입고 예상 '+dd+'일');
      patch.eta = eta; ch.push(tag+' · '+(curFixed?fmtDY(curFixed):(o.eta?fmtDY(o.eta)+'(예상)':'미정'))+' → '+fmtDY(eta));
      logs.push({type:'eta', from:curFixed, to:eta, msg:tag+' · 예정일 '+(curFixed?fmtDY(curFixed):'미정')+' → '+fmtDY(eta)+' (리오더 시트)'});
    }
    if(reason && reason!==o.etaReason && !String(o.memo||'').includes(reason) && isOpen(o)){ patch.reason = reason; ch.push('사유: '+reason); }
    let recvQ = 0;
    if(done && o.remain>0) recvQ = o.remain;
    else if(part && part > o.recv && !o.closed) recvQ = part - o.recv;
    if(recvQ>0){ ch.push((done?'입고완료':'입고 '+nf(part)+'장까지')+' → +'+nf(recvQ)+'장'); }
    if(!ch.length){ same++; continue; }
    plan.push({type: recvQ>0 ? 'recv' : (patch.eta||patch.reason ? 'eta' : 'qty'), p, o, od, qty, patch, logs, recvQ, recvD: (eta && eta<=TODAY ? eta : TODAY), label: recvQ>0 ? '입고 반영' : (shift==='late' ? '일정 지연 예정' : shift==='early' ? '조기 입고 예상' : shift==='set' ? '일정 확정' : patch.reason ? '사유 반영' : '수량 변경'), shift, text: ch.join(' · ')});
  }
  return {plan, miss, same, skipped, dup, header, total: rows.length - start};
}
function regSync(){

async function syncApply(){ if(!need('reorder')) return;
  const R = S.sync.res; if(!R) return;
  const picks = R.plan.filter((x,i)=>!S.sync.off[i]);
  if(!picks.length){ toast('반영할 줄을 고르세요'); return; }
  const at = new Date().toISOString(); const c = {new:0, eta:0, recv:0, qty:0};
  const n = await guardN(async()=>{
    for(const x of picks){
      if(x.type==='new'){
        const ref = await DB.collection('ord').add({b:x.p.b, f:x.p.curFac, round:nextRound(x.p), od:x.od, qty:x.qty, eta:x.eta||'', memo:(x.reason||''), src:'리오더 시트', at, by:MYID||''});
        if((x.done || x.part) && ref && ref.id){ const q = x.done ? x.qty : Math.min(x.part, x.qty); await DB.doc('ovr/n_'+ref.id).set({recv:[{q, d:(x.eta && x.eta<=TODAY ? x.eta : TODAY), by:MYID||''}], log:[{at, by:MYID||'', type:'recv', msg:'입고 '+q+'장 (리오더 시트)'}]}); }
        c.new++; continue;
      }
      const o = x.o; const cur = Object.assign({}, ovr[o.id]||{}); const patch = Object.assign({}, x.patch); const logs = (x.logs||[]).slice();
      if(x.recvQ>0){ patch.recv = (Array.isArray(cur.recv)?cur.recv:[]).concat([{q:x.recvQ, d:x.recvD, by:MYID||''}]); logs.push({type:'recv', msg:'입고 '+x.recvQ+'장 (리오더 시트)'}); }
      const next = Object.assign(cur, patch);
      next.log = (Array.isArray(next.log)?next.log:[]).concat(logs.map(l=>Object.assign({at, by:MYID||''}, l))).slice(-40);
      await DB.doc('ovr/'+o.id).set(next);
      c[x.type]++;
    }
    await writeLog('리오더 시트 반영: 신규 '+c.new+' · 일정 '+c.eta+' · 입고 '+c.recv+' · 수량 '+c.qty+'건');
    return picks.length;
  });
  if(n){ toast(n+'건 반영했습니다'); S.sync.res = null; S.sync.off = {}; render(); }
}

function parseDelim(t, d){
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<t.length;i++){
    const c = t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if(c==='"' && cell===''){ q = true; }
    else if(c===d){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && t[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const unwrapX = v => String(v==null?'':v).replace(/^="(.*)"$/,'$1').trim();
function facFromSupplier(s){
  let x = unwrapX(s).replace(/\(.*?\)/g,'').split('-')[0].trim();
  x = x.replace(TITLE_RE,'').replace(/님$/,'').trim();
  if(!x) return '';
  const hit = FACTORIES.find(f=>normK(f)===normK(x));
  return hit || x;
}
function plParse(text){
  const d = (text.split('\n')[0].match(/\t/g)||[]).length >= (text.split('\n')[0].match(/,/g)||[]).length ? '\t' : ',';
  const rows = parseDelim(text, d).filter(r=>r.some(c=>String(c).trim()));
  let hi = rows.findIndex(r=>r.some(c=>/바코드/.test(c)) && r.some(c=>/옵션/.test(c)));
  if(hi<0) return {err:'머리글 줄을 찾지 못했습니다. "바코드번호", "옵션명" 머리글이 포함되게 복사해 주세요.'};
  const H = rows[hi].map(x=>unwrapX(x).replace(/\s/g,''));
  const col = (...ks) => { for(const k of ks){ const i = H.findIndex(h=>h===k); if(i>=0) return i; } for(const k of ks){ const i = H.findIndex(h=>h.startsWith(k)); if(i>=0) return i; } return -1; };
  const C = {b:col('바코드번호','바코드'), en:col('상품명'), n:col('사입상품명','제작품명'), opt:col('옵션명','옵션'), cat:col('상품분류','분류'), sup:col('공급처'), reg:col('상품등록일자','등록일'), stock:col('현재재고'), avail:col('가용재고'), sold:col('품절여부'), img:col('대표이미지주소','이미지주소')};
  const g = (r,k) => C[k]>=0 ? unwrapX(r[C[k]]) : '';
  const iT = H.map((h,i)=>/트랜쇼/.test(h)&&!/오프라인/.test(h)?i:-1).filter(i=>i>=0), iH = H.map((h,i)=>/본사/.test(h)&&/창고|재고/.test(h)?i:-1).filter(i=>i>=0), iU = H.findIndex(h=>/미발송/.test(h));
  const num = v => parseInt(String(unwrapX(v)||'0').replace(/[^\d-]/g,''),10) || 0;
  const out = []; const seen = new Set(); let dupIn = 0;
  for(const r of rows.slice(hi+1)){
    const b = g(r,'b'); if(!b) continue;
    if(seen.has(b)){ dupIn++; continue; } seen.add(b);
    out.push({b, en:g(r,'en'), n:g(r,'n'), opt:g(r,'opt').replace(/\s*,\s*/g,','), cat:g(r,'cat'), sup:g(r,'sup'), f:facFromSupplier(g(r,'sup')), reg:(g(r,'reg').match(/\d{4}-\d{2}-\d{2}/)||[''])[0], stock:g(r,'stock'), avail:(C.avail>=0 ? g(r,'avail') : (iU>=0 && g(r,'stock')!=='' ? String(num(r[C.stock]) - num(r[iU])) : '')), wh: iT.length ? [iT.reduce((t,i)=>t+num(r[i]),0), iH.reduce((t,i)=>t+num(r[i]),0), iU>=0 ? num(r[iU]) : 0] : null, sold:g(r,'sold'), img:cleanUrl(g(r,'img'))});
  }
  return {rows:out, dupIn};
}
function plPlan(rows){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const fresh = [], diff = []; let same = 0;
  for(const r of rows){
    const p = byB.get(r.b);
    if(!p){
      const skip = !r.n || /^자사$/.test(unwrapX(r.sup)) || /사은품|럭키박스|단일상품/.test(r.n+r.opt);
      fresh.push(Object.assign(r, {on:!skip, why: skip ? (!r.n ? '제작품명 없음' : '자사 · 사은품') : '', newFac: r.f && !FACTORIES.includes(r.f)}));
      continue;
    }
    const ch = {};
    for(const k of ['n','en','opt','cat']) if(r[k] && r[k]!==p[k]) ch[k] = r[k];
    if(Object.keys(ch).length) diff.push({p, r, ch, on:false}); else same++;
  }
  fresh.sort((a,b)=>(b.on-a.on) || (b.reg||'').localeCompare(a.reg||'') || (a.n||'').localeCompare(b.n||'','ko'));
  return {fresh, diff, same};
}

function plRun(text, fileName){

function recvPlan(text){
  const rows = parseTSV(text).map(r=>r.map(x=>String(x||'').trim())).filter(r=>r.some(Boolean));
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const plan = [], miss = []; const used = {};
  for(const r of rows){
    const bi = r.findIndex(x=>/^1-\d{10}$/.test(x.replace(/^잔여량-/,''))); if(bi<0) continue;
    const b = r[bi].replace(/^잔여량-/,'');
    const rest = r.slice(bi+1);
    const qi = rest.findIndex(x=>/^\d+$/.test(x.replace(/,/g,''))); const qty = qi>=0 ? parseInt(rest[qi].replace(/,/g,''),10) : 0;
    const d = rest.map(x=>parseDay(x)).find(Boolean) || TODAY;
    const p = byB.get(b);
    if(!p || !(qty>0)){ miss.push({b, qty, why: !p ? '보드에 없는 바코드' : '수량 없음'}); continue; }
    // 먼저 오더한 차수부터 잔여를 채운다
    let left = qty;
    const opens = p.orders.filter(isOpen).sort((x,y)=>(x.od||'').localeCompare(y.od||''));
    for(const o of opens){ const can = o.remain - (used[o.id]||0); if(can<=0) continue; const q = Math.min(can, left); used[o.id] = (used[o.id]||0)+q; plan.push({o, q, d}); left -= q; if(!left) break; }
    if(left>0){
      const last = opens[opens.length-1] || p.orders[p.orders.length-1];
      if(last) plan.push({o:last, q:left, d, over:true}); else miss.push({b, qty:left, why:'입고 기다리는 오더 없음'});
    }
  }
  return {plan, miss};
}

function stockPlan(text){
  const r = plParse(text); if(r.err) return {err:r.err};
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const items = {}; let same = 0, changed = 0, notIn = 0; const diffs = [];
  for(const x of r.rows){
    const st = parseInt(String(x.stock).replace(/[^\d-]/g,''),10), av = parseInt(String(x.avail).replace(/[^\d-]/g,''),10);
    if(isNaN(st) && isNaN(av)) continue;
    items[x.b] = [isNaN(st)?0:st, isNaN(av)?(isNaN(st)?0:st):av].concat(x.wh || []);
    const p = byB.get(x.b);
    if(!p){ notIn++; continue; }
    if(String(p.stock)===String(items[x.b][0]) && String(p.avail)===String(items[x.b][1]) && (!x.wh || (p.trans===x.wh[0] && p.hq===x.wh[1]))) same++;
    else { changed++; if(diffs.length<300) diffs.push({p, from:[p.stock, p.avail], to:items[x.b]}); }
  }
  return {items, n:Object.keys(items).length, same, changed, notIn, diffs};
}

function buildMix(){
  MIX = new Map(); const g = new Map();
  for(const p of PRODS.values()){ const k = normK(p.n); if(!k) continue; if(!g.has(k)) g.set(k, []); g.get(k).push(p); }
  for(const ps of g.values()){

    const facs = Object.keys(cnt); if(facs.length<2) continue;

  }

  const seasons = [...se].sort((a,b)=>{ const A=sk(a), B=sk(b); return B[0]-A[0] || B[1]-A[1] || B[2]-A[2]; });

const cleanUrl = u => { u = unwrapX(u||'').trim(); if(!u) return ''; return 'https://'+u.replace(/^(https?:)?\/+/,''); };
function stockPlanRows(rows){
  const byB = new Map(); for(const p of PRODS.values()) if(p.b) byB.set(p.b, p);
  const items = {}, imgs = {}; let same = 0, changed = 0, notIn = 0; const diffs = [];
  for(const x of rows){
    if(x.img) imgs[x.b] = x.img;
    const st = parseInt(String(x.stock).replace(/[^\d-]/g,''),10), av = parseInt(String(x.avail).replace(/[^\d-]/g,''),10);
    if(isNaN(st) && isNaN(av)) continue;
    items[x.b] = [isNaN(st)?0:st, isNaN(av)?(isNaN(st)?0:st):av].concat(x.wh || []);
    const p = byB.get(x.b);
    if(!p){ notIn++; continue; }
    if(String(p.stock)===String(items[x.b][0]) && String(p.avail)===String(items[x.b][1]) && (!x.wh || (p.trans===x.wh[0] && p.hq===x.wh[1]))) same++;
    else { changed++; if(diffs.length<300) diffs.push({p, from:[p.stock, p.avail], to:items[x.b]}); }
  }
  return {items, imgs, n:Object.keys(items).length, same, changed, notIn, diffs};
}

function unifyFactories(){
  const grp = new Map();
  for(const p of PRODS.values()){ const k = normK(p.n); if(!k) continue; if(!grp.has(k)) grp.set(k, []); grp.get(k).push(p); }
  for(const ps of grp.values()){
    if(new Set(ps.map(p=>p.curFac)).size < 2) continue;
    let best = null;
    for(const p of ps){
      for(const o of p.orders) if(o.od && (!best || o.od > best.d)) best = {d:o.od, f:o.f};
      for(const c of (p.moves||[])){ const d = String(c.date||c.at||'').slice(0,10); if(d && c.to && (!best || d >= best.d)) best = {d, f:c.to}; }
    }
    if(best) for(const p of ps) if(p.curFac !== best.f){ p.unifiedFrom = p.curFac; p.curFac = best.f; p.facs.add(best.f); }
  }
}

function salesOf(b){ const S1 = salesSrc(); const x = S1 && S1.items && S1.items[b]; return x ? {wk:+x[0]||0, unsent:+x[1]||0} : {wk:0, unsent:0}; }

function rvCalc(p){
  const r = rvOf(p.b), s = salesOf(p.b);
  const opens = p.orders.filter(isOpen).sort((a,b)=>(a.eta||'9').localeCompare(b.eta||'9'));
  const inc = opens.reduce((t,o)=>t+o.remain,0), next = opens[0] || null;
  const known = hasStock(p);
  const wh = p.trans!=null;
  const rest = known ? (wh ? p.trans - (p.unsent||0) : (Number(p.avail)||0)) : null;
  const live = r.rounds.filter(x=>!x.done);
  const rq = live.reduce((t,x)=>t+(+x.q||0),0);
  const total = (rest||0) + rq;
  const st = r.st || (known && rest>0 ? '일반배송' : '');
  let lvl = '';
  if(s.wk>0 && st!=='단종'){ if(total < s.wk*0.3) lvl = '긴급'; else if(total < s.wk*0.6) lvl = '주의'; }
  const acts = [];
  const shipFrom = next && next.eta ? bizAdd(next.eta > TODAY ? next.eta : TODAY, QC_DAYS) : '';
  if(st!=='단종' && !saleOff(r)){
    if((st==='일반배송' || !st) && known && rest<=0 && inc>0) acts.push('toResv');
    if(st==='예약배송'){
      if(!live.length && inc>0) acts.push('noRound');
      if(shipFrom && live.some(x=>x.d && x.d < shipFrom)) acts.push('risk');
      if(known && rest>0 && (!live.length || live.every(x=>x.d && x.d<=TODAY))) acts.push('toNormal');
    }
    if((st==='일반배송' || st==='예약배송') && known && rest<=0 && inc===0 && rq===0 && !(wh && (p.hq||0)>0)) acts.push('toSold');
    if(st==='품절' && ((known && rest>0) || inc>0)) acts.push('reopen');
    if(wh && (p.hq||0)>0 && rest<=0 && (st==='예약배송' || s.wk>0)) acts.push('qc');
  }
  return {p, r, s, st, opens, inc, next, known, rest, rq, total, lvl, acts, shipFrom, live, wh, cat:rvCatOf(p)};
}

  if(t.dataset && t.dataset.facsel){ const i = document.getElementById(t.id+'_new'); if(i){ i.hidden = t.value!=='__new'; if(!i.hidden) i.focus(); } }
  if(t.dataset && t.dataset.country!=null){ setCountry(t.dataset.country, t.value); }
  if(t.id==='mngOff'){ S.mng.showOff=t.checked; render(); }
  if(t.id==='facOpen'){ S.fac.onlyOpen=t.checked; S.fac.n=15; render(); }
  if(t.id==='dueSort'){ S.due.sort=t.value; render(); }
  if(t.id==='bulk_od') S.reg.bulk_od=t.value;
});

refreshNow();
initCaps();
})();
</script>
